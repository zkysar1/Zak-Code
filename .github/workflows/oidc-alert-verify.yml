name: OIDC alert-path verification (TEMPORARY — g-010-82 step 4)
# ============================================================================
# TEMPORARY. DELETE THIS FILE once g-010-82 step 4 is recorded. It exists to
# answer one question the normal workflows cannot: does the KEYLESS credential
# path actually work end to end?
#
# WHY A PROBE AND NOT A FORCED FAILURE. g-010-82 step 4 says "force a failure
# (or dispatch a temporary test job)" to exercise the alert path, because the
# real alert steps are `if: failure()` + `continue-on-error: true` -- a green
# CI run proves NOTHING about them, and a broken one fails silently. Forcing a
# real failure would mean deliberately reddening a protected production main
# (all four ZDS repos carry enforce_admins: true) to observe something that can
# be measured directly. This job is the "temporary test job" half of that
# instruction. Zak-Code specifically, because it is the only one of the four
# with no Amplify deploy attached to main -- pushing this file triggers zero
# deploys.
#
# WHAT IT PROVES, AND WHAT IT DOES NOT.
#   PROVES: the OIDC provider mints a token for this repo; the trust policy on
#           ayoai-zds-ci-alert-oidc accepts it; the inline ses:SendEmail policy
#           permits the send; and the message reaches the agent inbox.
#   DOES NOT PROVE: that the real alert steps' `if:` conditions are correct.
#           Those were verified separately by asserting each configure step's
#           condition is byte-identical to the alert step it feeds.
#
# THE SUB CLAIM IS MEASURED HERE, NOT INFERRED. The trust policy matches
# `repo:zkysar1/Zak-Code:ref:refs/heads/main`. Every migrated workflow's own
# comments flag the schedule-event sub claim as INFERENCE from how GitHub
# builds the claim. This job decodes the token payload and prints the actual
# sub/aud/ref/event_name, so the claim becomes an observation on both the
# dispatch and schedule paths.
#
# THE SCHEDULE PATH DELIBERATELY SENDS NO EMAIL. If this file outlives its
# purpose, a lingering cron that emailed the agent inbox every 10 minutes
# would be real damage; a lingering cron that only assumes a role and prints a
# claim is inert. So the send is gated to workflow_dispatch and the schedule
# run measures the claim only. Blast radius of forgetting to delete this file
# is therefore bounded to a periodic no-op run.
# ============================================================================
on:
  workflow_dispatch:
  schedule:
    # Frequent ON PURPOSE and safe BECAUSE the scheduled path sends nothing --
    # see the note above. The only reason it exists is to capture a real
    # `schedule`-event sub claim quickly, which is the one thing the migrated
    # smoke.yml files could not observe about themselves.
    - cron: '*/10 * * * *'
jobs:
  verify:
    runs-on: ubuntu-latest
    # Same shape as the migrated alert jobs: the block REPLACES the job's full
    # default set, so contents: read is named explicitly even though this job
    # does not check out (kept for parity with what it is verifying).
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Measure the actual OIDC sub claim (never prints the token)
        # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN are injected into the step
        # environment by the runner itself, and ONLY when id-token: write is
        # granted. Deliberately not re-declared under `env:` -- a
        # `${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}` expression is evaluated
        # before the runner injects them and would resolve to empty, turning a
        # working probe into a confusing curl failure.
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          # Decode ONLY the payload segment. The full JWT is a live credential
          # and is never echoed. The payload carries claims, no secret.
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)          # JWT is base64url, unpadded
          c = json.loads(base64.urlsafe_b64decode(payload))
          print("MEASURED OIDC CLAIMS")
          for k in ("sub", "aud", "ref", "event_name", "repository", "workflow_ref"):
              print(f"  {k} = {c.get(k)}")
          expected = "repo:zkysar1/Zak-Code:ref:refs/heads/main"
          print(f"  trust-policy entry = {expected}")
          print(f"  MATCH = {c.get('sub') == expected}")
          PY
      - name: Assume the alert role, keylessly
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377285145:role/ayoai-zds-ci-alert-oidc
          aws-region: us-east-2
      - name: Confirm the assumed identity
        run: aws sts get-caller-identity
      - name: Send the probe alert (workflow_dispatch ONLY — see header)
        if: github.event_name == 'workflow_dispatch'
        env:
          AWS_DEFAULT_REGION: us-east-2
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg repo "$REPO" --arg run "$RUN_URL" \
            '{FromEmailAddress:"agents@zacharykysar.com",Destination:{ToAddresses:["agents@zacharykysar.com"]},Content:{Simple:{Subject:{Data:"[OIDC-VERIFY] g-010-82 step 4 — keyless alert path probe"},Body:{Text:{Data:("DELIBERATE PROBE, NOT AN INCIDENT. Nothing is broken.\n\nThis message was sent by a temporary workflow verifying that the CI failure-alert path works without the long-lived AWS key. It used no secret: the runner minted an OIDC token, ayoai-zds-ci-alert-oidc accepted it, and its inline ses:SendEmail policy authorized this send.\n\nrepo: "+$repo+"\nrun: "+$run+"\n\nArrival of this email IS the evidence for g-010-82 verify criterion 3. No action needed; the workflow that sent it is being deleted.")}}}}}' > oidc-verify.json
          aws sesv2 send-email --cli-input-json file://oidc-verify.json
