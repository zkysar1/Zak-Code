name: agent-bench

# A scheduled, key-gated AGENT-QUALITY benchmark. It MEASURES the agent against REAL models
# (pass-rate, $/task, tokens, convergence) and records the numbers as a job summary + an artifact;
# it never gates a PR (quality is tracked, not enforced — a noisy model regression must not block
# merges). Normal CI (ci.yml) is untouched. It runs ONLY on the canonical repo (forks never get
# the secrets) and ONLY when provider API keys are configured, so an unconfigured repo no-ops.
#
# The no-op is a SEPARATE JOB (`gate`) on purpose (ADR-0142). When the keys are absent the `bench`
# job is `skipped` — GitHub's own word for "did not run" — instead of reporting `success` for a
# measurement that never happened. A quality bench that is green because it did nothing is worse
# than no bench: "the bench is green" then reads identically to "the bench has never run", and it
# read that way here for the workflow's whole life (measured 2026-09-11: five consecutive nightly
# runs, conclusion=success, `Run the suite` skipped every time, no provider keys on the repo).
# Gating in its own job also makes the dark path genuinely free — the old single-job form paid for
# a checkout and a full `uv sync --extra dev --extra server` every night before discovering it had
# nothing to do.
#
# NOTE: a real-model run costs money. The schedule is nightly per the project owner's request — to
# spend less, change the cron to weekly ("0 7 * * 1") or simply remove the OPENAI_API_KEY /
# GROQ_API_KEY repo secrets (the gate step then skips every run). Trigger ad-hoc any time via the
# "Run workflow" button (workflow_dispatch), optionally narrowing the task set or overriding the
# model — run it twice with different models to compare (e.g. N-small fan-out vs one big model).

on:
  schedule:
    - cron: "0 7 * * *" # nightly ~07:00 UTC
  workflow_dispatch:
    inputs:
      filters:
        description: "Task-id prefixes to run (space-separated); blank = all tasks"
        required: false
        default: ""
      jobs:
        description: "Concurrency (Groq rate limits keep this low)"
        required: false
        default: "3"
      model:
        description: "Override ZAKCODE_DEFAULT_MODEL (blank = repo default); run twice to compare"
        required: false
        default: ""

permissions:
  contents: read

# Never run two benches at once (they hit shared rate-limited providers); don't cancel an
# in-flight paid run when a new one is queued.
concurrency:
  group: agent-bench
  cancel-in-progress: false

jobs:
  # Its own job so the bench below can be SKIPPED rather than falsely green (ADR-0142), and so an
  # unconfigured repo costs one trivial step instead of a full dependency sync.
  gate:
    name: provider keys configured?
    runs-on: ubuntu-latest
    if: github.repository == 'zkysar1/Zak-Code' # forks have no secrets; skip entirely
    timeout-minutes: 5
    outputs:
      run: ${{ steps.keys.outputs.run }}
    steps:
      - name: Gate on provider keys
        id: keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::No provider API keys (OPENAI_API_KEY / GROQ_API_KEY) configured — the agent bench will be SKIPPED, not passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo '## Agent quality bench — NOT MEASURED'
              echo
              echo 'No `OPENAI_API_KEY` / `GROQ_API_KEY` on this repository, so the suite did not run'
              echo 'and **this run says nothing about agent quality**. The bench job is reported as'
              echo '`skipped` rather than `success` precisely so that stays visible.'
              echo
              echo 'To measure: add either secret, or run the suite locally against a self-hosted'
              echo 'endpoint (`bench/README.md` — no key required).'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  bench:
    name: agent quality bench
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync (dev + server extras)
        run: uv sync --extra dev --extra server

      - name: Run the suite
        # Dispatch inputs flow through env: (NOT inlined into the script) — the standard guard
        # against shell-injection via a workflow_dispatch input. $BENCH_FILTERS is intentionally
        # unquoted so a space-separated prefix list word-splits into separate positional args.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAKCODE_DEFAULT_MODEL: ${{ github.event.inputs.model }}
          BENCH_FILTERS: ${{ github.event.inputs.filters }}
          BENCH_JOBS: ${{ github.event.inputs.jobs || '3' }}
        run: |
          uv run --no-sync python bench/run_suite.py $BENCH_FILTERS \
            --jobs "${BENCH_JOBS:-3}" | tee bench-output.txt

      - name: Publish summary
        run: |
          {
            echo '## Agent quality bench'
            echo
            echo "model: \`${ZAKCODE_DEFAULT_MODEL:-<repo default>}\`  ·  run: ${GITHUB_RUN_ID}"
            echo
            echo '```'
            tail -n 40 bench-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ZAKCODE_DEFAULT_MODEL: ${{ github.event.inputs.model }}

      - name: Upload results JSON
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: bench/results/*.json
          if-no-files-found: warn
