name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · type · test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # v7 is the latest *moving major* tag (v8 ships full tags like v8.1.0 only);
        # both v6+ run on Node 24.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync (dev + server extras)
        run: uv sync --extra dev --extra server --python ${{ matrix.python-version }}

      # Every step uses --no-sync so it runs against the env synced above and never
      # re-syncs to the default (which would prune the optional `server` extra — i.e.
      # uninstall fastapi — and break the server tests' collection).
      - name: Ruff (lint)
        run: uv run --no-sync ruff check .

      - name: Ruff (format check)
        run: uv run --no-sync ruff format --check .

      - name: Mypy (type check)
        run: uv run --no-sync mypy

      - name: Pytest
        run: uv run --no-sync pytest -q
