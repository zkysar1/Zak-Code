name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dispatch publishes a CANDIDATE build to the DEV artifact channel and runs nothing else
  # (g-370-47; see publish-dev-channel). `gh workflow run ci.yml --ref main -f lane=dev -f ref=<ref>`.
  workflow_dispatch:
    inputs:
      lane:
        description: Artifact lane to publish to. dev is the only lane a dispatch can open.
        type: choice
        options: [dev]
        required: true
      ref:
        description: Branch, tag or full sha of this repository to build into that lane.
        type: string
        required: true

# Cancel superseded runs on the same ref -- for pull requests. A push to main gets a group of
# its own, keyed on the commit: with one shared group for main, RE-RUNNING an older run's failed
# job cancelled the newest commit's run in flight ("a higher priority waiting request for
# ci-refs/heads/main exists"), and a cancelled run alerts nobody and publishes nothing.
# Measured 2026-09-18: a re-run of 853178e's run cancelled 1b7842a's.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · type · test (py${{ matrix.python-version }}, ${{ matrix.os }})
    # A dispatch (publish-dev-channel) is not a test run: it tests main's copy, not the candidate.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # Job-level ceiling (matters most for the Windows cell, which cannot use the
    # GNU `timeout` session watchdog below); per-test bound is pytest-timeout.
    # Green verify jobs took 706-884 s on Windows and 444-612 s on Linux
    # (56 jobs, 2026-10-30 to 2026-11-01), so 35 min gives the slowest about
    # 2.4 times its run (ADR-0349).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # One Windows cell (audit P2-4): the dev box is Windows and the 2026-06-08
        # hang incident was ubuntu-only — cross-platform signal matters both ways.
        include:
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # v7 is the latest *moving major* tag (v8 ships full tags like v8.1.0 only);
        # both v6+ run on Node 24.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync (dev + server extras)
        run: uv sync --extra dev --extra server --python ${{ matrix.python-version }}

      # Every step uses --no-sync so it runs against the env synced above and never
      # re-syncs to the default (which would prune the optional `server` extra — i.e.
      # uninstall fastapi — and break the server tests' collection).
      - name: Ruff (lint)
        run: uv run --no-sync ruff check .

      - name: Ruff (format check)
        run: uv run --no-sync ruff format --check .

      - name: Mypy (type check)
        run: uv run --no-sync mypy

      - name: Pytest (Linux — session watchdog + coverage)
        if: runner.os == 'Linux'
        # Session-level safety bound: PYTHONFAULTHANDLER + `timeout -s ABRT` make
        # any future hang fail in minutes with an all-thread traceback instead of
        # stalling silently to the runner ceiling (the failure class this PR fixes).
        # Per-test bound is in pyproject (pytest-timeout, timeout=120). This step
        # took 419-575 s on 42 green Linux jobs (2026-10-30 to 2026-11-01), so the
        # bound is 1,200 s, about twice the slowest (ADR-0349).
        #
        # --basetemp puts every tmp_path under a folder with a SPACE in its name, like a Windows
        # user's profile folder. A test that builds a command from a temp path must then quote
        # it, and one that does not fails here instead of on that user's machine (nine tests
        # did not, and a hint cut a path at its first space; found by hand on 2026-10-13).
        env:
          PYTHONFAULTHANDLER: "1"
        run: timeout -s ABRT -k 30 1200 uv run --no-sync pytest -q --basetemp "$RUNNER_TEMP/zak code tmp" --cov=zakcode --cov-report=xml --cov-report=term

      - name: Pytest (Windows)
        if: runner.os == 'Windows'
        # GNU `timeout` does not exist here; the job-level timeout-minutes is the
        # session bound and pytest-timeout (thread method) the per-test bound.
        # The spaced --basetemp is the Linux step's (see there); PowerShell expands
        # $env:RUNNER_TEMP inside the double quotes and hands pytest one argument.
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --no-sync pytest -q --basetemp "$env:RUNNER_TEMP\zak code tmp"

      - name: Upload coverage report
        # One cell is enough for the artifact (audit P2-1; acceptance 13).
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # `zakcode update` replaces the install it runs from. Windows will not delete the files of a
  # running program, which is how one user's update deleted its own dependencies and left an
  # environment with nothing in it (ADR-0291). The unit tests fake uv and git and cannot see
  # that, so this drives the real thing: a real uv, a real git remote, a real tool environment.
  # It is its own job because it needs the network and takes minutes, which keeps `verify`
  # offline and fast; neither publish-sidecar nor the failure alert waits on it.
  update-e2e:
    name: update end to end (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --extra dev --python 3.11

      - name: Update end to end
        env:
          ZAKCODE_UPDATE_E2E: "1"
          PYTHONFAULTHANDLER: "1"
        run: uv run --no-sync pytest -q -s tests/test_update_e2e.py

  # The cockpit is tmux, and every cockpit test in `verify` fakes tmux: they record the commands the
  # cockpit would send and never run them, so none of them shows what a person sees. This opens the
  # real cockpit in a real tmux, types into its box and reads its panes, with a stand-in model on
  # loopback, so it needs no key (ADR-0356). Linux only, since the cockpit needs tmux.
  # publish-sidecar does not wait on it; the failure alert does (ADR-0357).
  # Its workspace and home sit under a folder with a SPACE in its name, as `verify`'s tmp paths
  # do (see there): there a path reaches only the fakes, here it reaches the commands a real tmux
  # runs. The tmux socket stays in a short folder of its own (the `tmux_dir` fixture).
  cockpit-e2e:
    name: cockpit in a real tmux
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install tmux
        run: |
          command -v tmux || { sudo apt-get update -q && sudo apt-get install -y -q tmux; }
          tmux -V

      - name: Sync (dev + server extras)
        run: uv sync --extra dev --extra server --python 3.11

      - name: The cockpit end to end
        env:
          ZAKCODE_COCKPIT_E2E: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          uv run --no-sync pytest -q -rs --basetemp "$RUNNER_TEMP/zak code tmp" tests/test_cockpit_tmux_e2e.py | tee "$RUNNER_TEMP/cockpit-e2e.txt"
          # A skipped test makes this job green while testing nothing, so a skip fails it.
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/cockpit-e2e.txt"; then
            echo "::error::the cockpit tests were skipped, so this job tested nothing"
            exit 1
          fi

  # Publish the sidecar runtime artifact to S3. This is the env-server JAR
  # pattern (build-ayo-environment-server.yml) applied to zak-code: the sidecar
  # runs on env-servers from an S3 tarball, NOT a git clone, so a merge that is
  # never packaged never reaches a running sidecar (the merged!=deployed gap that
  # forced a manual refresh for PR #156; g-364-42). `needs: verify` gates on the
  # full test matrix; the push+main `if` keeps it off PRs. OIDC-keyless via the
  # shared zds CI role, which carries a scoped s3:PutObject inline policy
  # (zds-ci-zak-code-s3-publish) for exactly the two prefixes written below.
  publish-sidecar:
    name: Publish sidecar artifact to S3
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A permissions block REPLACES the job default set — name contents (checkout +
    # git archive) explicitly alongside the OIDC id-token.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377285145:role/ayoai-zds-ci-alert-oidc
          aws-region: us-east-2

      - name: Build sidecar tarball (git archive — source runtime; the box builds the uv venv)
        run: |
          set -euo pipefail
          # git archive HEAD reproduces exactly what provision-env.sh expects:
          # tracked files at the tarball root, no .git/, no venv. checkout@v6 is
          # shallow (depth 1) which is sufficient — archive only needs HEAD's tree.
          git archive --format=tar.gz -o zak-code-main.tar.gz HEAD
          echo "tarball size: $(du -h zak-code-main.tar.gz | cut -f1)"
          # Positive control: fail loudly if the runtime is not actually in the
          # tarball, rather than silently shipping an empty/partial archive.
          # Capture the listing to a file first — piping `tar tzf` into `grep -q`
          # trips SIGPIPE under `set -o pipefail`: grep -q exits on the first
          # match, tar gets "stdout: write error" (SIGPIPE), pipefail propagates
          # its non-zero, and the check fails EXACTLY WHEN THE FILE IS PRESENT
          # (the false "absent" abort on the first publish run, 32420052582).
          tar tzf zak-code-main.tar.gz > tarball-contents.txt
          grep -q '^src/zakcode/server/app.py$' tarball-contents.txt \
            || { echo "::error::src/zakcode/server/app.py absent from tarball — refusing to publish"; exit 1; }

      - name: Publish to S3 (immutable <sha> + latest pointer)
        env:
          BUCKET: ayoai-jar-deployments
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # branch= tells a consumer which lane produced the object it runs (rb-10344). The job's
          # own `if` makes this lane main, so the value is not read from the event.
          META="commit_sha=${SHA},repo=${REPO},build_number=${RUN},branch=main"
          # The latest/ pointer only ever moves to main's TIP. A re-run of an OLDER run is
          # a push-to-main run too, and it used to publish its older build over a newer one:
          # measured 2026-09-18, latest/ went acbd40e -> 853178e for 18 minutes. Read the
          # tip BEFORE anything is written, and refuse to guess when it cannot be read.
          TIP="$(git ls-remote origin refs/heads/main | cut -f1)" || TIP=""
          [ -n "$TIP" ] || { echo "::error::could not read the tip of main -- refusing to decide which build latest/ carries"; exit 1; }
          # 1. Immutable, versioned copy — the rollback source (repoint by copy).
          aws s3 cp zak-code-main.tar.gz "s3://${BUCKET}/zak-code-deployments/${SHA}/zak-code-main.tar.gz" --metadata "$META"
          # 2. New canonical channel pointer.
          if [ "$TIP" = "$SHA" ]; then
            aws s3 cp zak-code-main.tar.gz "s3://${BUCKET}/zak-code-deployments/latest/zak-code-main.tar.gz" --metadata "$META"
            echo "✅ published sha=${SHA} and latest pointer"
          else
            echo "::warning::main is at ${TIP} and this run built ${SHA}: published the immutable copy only. latest/ belongs to the run for main's tip."
          fi
          # The legacy mind-sidecar-deployments/artifacts/ bridge write was retired
          # here (g-357-10 item 2) once provision-env.sh was repointed to the
          # zak-code-deployments/latest/ pointer above; it had no remaining reader.

  # Publish a CANDIDATE build to the DEV artifact channel, zak-code-deployments/dev/ (g-370-47).
  # The only trigger is a dispatch: gh workflow run ci.yml --ref main -f lane=dev -f ref=<ref>
  #
  # WHY A DISPATCH ON MAIN AND NOT A BRANCH. This repository has no dev branch and must not get one
  # (the SDLC charter: its dev plane is the artifact CHANNEL). A candidate zakcode change reaches a
  # dev vessel by being built from its ref into dev/, with no merge to main, so a change that has to
  # be tried on a vessel no longer has to ride the hotfix lane to main first (the 2026-09-01
  # ZAKCODE_FALLBACK_MODEL fix, #336).
  #
  # THIS JOB RUNS MAIN'S COPY OF THIS FILE. It refuses unless the workflow ref is refs/heads/main,
  # so the OIDC subject is the one the publish role already trusts, and a dispatch from a candidate
  # branch (which carries the candidate's own copy of this file) cannot mint credentials. The
  # candidate is only checked out and archived: nothing from it runs here. Its tests are the checks
  # of its own pull request.
  #
  # THE LANE RESOLVES THROUGH AN EXPLICIT ALLOWLIST THAT DEFAULTS TO REFUSE (guard-5402). An
  # unrecognised lane fails the step. It never falls through to the production name, and nothing in
  # this job can write latest/: that pointer belongs to publish-sidecar alone, gated to a push to
  # main. Order mattered: the discriminator and its refusal land in the same change as the trigger.
  #
  # THE CONSUMER'S DEFAULT IS THE OPPOSITE, and that is not an inconsistency. Here a wrong channel
  # corrupts what production boots, so the safe default is REFUSE. A vessel's provisioner that cannot
  # resolve a channel is a broken launch, so there only the exact literal dev opens the dev prefix and
  # everything else, unset included, reads prod. Both are allowlists; they differ in which direction
  # is expensive. Do not make them match by flipping either one.
  #
  # guard-5410 AUDIT. Every step in this file that writes outside the runner, and what tells the
  # consumer which lane produced it (tests/test_ci_dev_channel_lane.py checks the gating):
  #   verify, "Upload coverage report" ........ GitHub's artifact store, this run only; no channel
  #   publish-sidecar, sha-keyed copy ......... a sha is unique per commit, lane-safe by construction;
  #                                             the job runs on a push to main only
  #   publish-sidecar, latest/ pointer ........ the prod channel; push to main only, and main's tip
  #   alert-on-failure, SES mail .............. not an artifact; a failed push to main only
  #   publish-dev-channel, dev/ object ........ lane from the allowlist below; branch= says which ref
  # No other step writes outside the runner.
  publish-dev-channel:
    name: Publish candidate to the dev channel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A permissions block REPLACES the job default set: name contents (checkout + git archive)
    # explicitly alongside the OIDC id-token.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377285145:role/ayoai-zds-ci-alert-oidc
          aws-region: us-east-2

      - name: Build the candidate and publish it to the dev channel
        env:
          BUCKET: ayoai-jar-deployments
          LANE: ${{ inputs.lane }}
          CANDIDATE: ${{ inputs.ref }}
          WORKFLOW_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          # Every value below arrives through env and no expression is interpolated into this
          # script (the runner would evaluate one even inside a comment), so a ref name cannot
          # become shell.
          [ "$WORKFLOW_REF" = "refs/heads/main" ] \
            || { echo "::error::dispatch on main (--ref main) and name the candidate in the ref input"; exit 1; }
          # LANE -> CHANNEL, an explicit allowlist that DEFAULTS TO REFUSE (guard-5402).
          case "$LANE" in
            dev) CHANNEL="dev" ;;
            *)
              echo "::error::Unrecognised lane -- refusing to publish. Add the lane here, with its own channel, before opening it." >&2
              exit 1
              ;;
          esac
          # The candidate becomes a git ref and a value in the object's metadata (comma-separated
          # key=value pairs): this character set keeps a comma, a space, a leading dash and ".." out.
          case "$CANDIDATE" in
            ''|-*|*..*|*[!A-Za-z0-9._/-]*)
              echo "::error::ref must be a branch, tag or sha of this repository (letters, digits, . _ / -)" >&2
              exit 1
              ;;
          esac
          SHA="$(git rev-parse HEAD)"
          git archive --format=tar.gz -o zak-code-main.tar.gz HEAD
          echo "tarball size: $(du -h zak-code-main.tar.gz | cut -f1)"
          # Positive control, as in publish-sidecar: list to a file first, since piping tar into
          # grep -q trips SIGPIPE under pipefail exactly when the file is present.
          tar tzf zak-code-main.tar.gz > tarball-contents.txt
          grep -q '^src/zakcode/server/app.py$' tarball-contents.txt \
            || { echo "::error::src/zakcode/server/app.py absent from tarball -- refusing to publish" >&2; exit 1; }
          # branch= is what lets a consumer resolve which ref produced the object it is running,
          # rather than infer it from the sha (rb-10344). The object is the same filename as prod's
          # under its own prefix: a vessel reads the channel by prefix and never by name.
          aws s3 cp zak-code-main.tar.gz "s3://${BUCKET}/zak-code-deployments/${CHANNEL}/zak-code-main.tar.gz" \
            --metadata "commit_sha=${SHA},repo=${REPO},build_number=${RUN},branch=${CANDIDATE}"
          echo "published ${SHA} (${CANDIDATE}) to the ${CHANNEL} channel"

  # Single alert job that runs ONCE after the whole matrix (needs: verify + cockpit-e2e +
  # publish-sidecar), not once per py-version cell. `failure()` here is true iff a job it
  # needs failed; cancelled runs (concurrency cancel-in-progress) are not failures,
  # so superseded pushes never alert. Gated to push-to-main so PR/feature-branch
  # runs (and fork PRs, which never receive secrets) stay quiet.
  #
  # Sends agents@zacharykysar.com -> agents@zacharykysar.com via the SCOPED
  # zds-ci-alert key (ses:SendEmail, FromAddress-locked). The
  # ForwardEmailReceivedAtZacharyKysarDotCom forwarder routes agents@ to the S3
  # agent-inbox (outbound-free, self-skip, echo-suppressed), so this alert is
  # TERMINAL -- it cannot trigger another email (loop-safe; guard-84). jq + aws
  # CLI are pre-installed on ubuntu-latest; no checkout needed.
  alert-on-failure:
    name: Alert agent inbox on CI failure
    needs: [verify, cockpit-e2e, publish-sidecar]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # OIDC keyless (g-010-82). A permissions block REPLACES the job's full
    # default set, so contents is named explicitly even though this job does
    # not check out -- omitting it would revoke it. id-token: write is what
    # lets the runner mint the OIDC token configure-aws-credentials exchanges.
    permissions:
      id-token: write
      contents: read
    steps:
      # No step-level `if:` needed here: the JOB-level if above already gates
      # every step. The other six workflow files in this migration put their
      # alert step inside a job that also runs on success, so there the
      # configure step MUST repeat the failure() condition or it will attempt
      # an OIDC assume on every green build.
      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891377285145:role/ayoai-zds-ci-alert-oidc
          aws-region: us-east-2
      - name: Send SES alert
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-2
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg repo "$REPO" --arg branch "$BRANCH" --arg sha "$SHA" --arg actor "$ACTOR" --arg run "$RUN_URL" \
            '{FromEmailAddress:"agents@zacharykysar.com",Destination:{ToAddresses:["agents@zacharykysar.com"]},Content:{Simple:{Subject:{Data:("[CI-FAIL] "+$repo+" @ "+$branch)},Body:{Text:{Data:("CI failed.\nrepo: "+$repo+"\nbranch: "+$branch+"\nsha: "+$sha+"\nactor: "+$actor+"\nrun: "+$run+"\n\nAutomated CI alert -- read-only notification. Do NOT reply by email; fix the build or file an Investigate goal.")}}}}}' > ci-alert.json
          aws sesv2 send-email --cli-input-json file://ci-alert.json
