[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zds-llm-provider"
version = "0.1.0"
description = "Vendor-agnostic LLM provider contract for the ZDS agent family."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
bitnet = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/zds_llm_provider"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["zds_llm_provider"]
