<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zak Code</title>
  <style>
    /* ── The Zak look (docs/UX.md): the terminal grammar in proportional type.
       Every hex lives in :root (dark default, light via prefers-color-scheme).
       --brand paints only: the spark, the ›/● markers, focus rings, links, the
       connection dot. Boxes are soft surfaces; motion is 120–150ms. ─────────── */
    :root {                              /* dark (default) */
      color-scheme: dark light;
      --bg:        #14171d;  --surface: #1b2026;  --inset: #0f1217;
      --line:      #2a313a;  --line-soft: #20262e;
      --fg:        #e9ecef;  --muted:   #99a3ae;  --faint: #66707b;
      --brand:     #38b6df;
      --ok:        #5fc88a;  --err:     #e5646e;  --warn:  #d9a13f;
      --add-bg:    #173321;  --add-fg:  #a9d8b4;
      --del-bg:    #391d22;  --del-fg:  #e3a9b0;
      --shadow:    0 8px 24px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.4);
      --font-prose: system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    }
    @media (prefers-color-scheme: light) { :root {
      --bg:        #faf9f7;  --surface: #ffffff;  --inset: #f2f0ec;
      --line:      #e2dfd9;  --line-soft: #eceae5;
      --fg:        #33312d;  --muted:   #6e6b64;  --faint: #a3a09a;
      --brand:     #117ba8;
      --ok:        #2c8a55;  --err:     #c23d49;  --warn:  #9a6b1f;
      --add-bg:    #e3f2e6;  --add-fg:  #1d5e35;
      --del-bg:    #fae3e5;  --del-fg:  #8f303a;
      --shadow:    0 8px 24px rgba(40,35,25,.08), 0 1px 2px rgba(40,35,25,.10);
    }}

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.65 var(--font-prose);
      display: flex; flex-direction: column;
    }
    /* one shared rule: streaming digits never jitter */
    .mono, .meta, .receipt, .chip, .tool-summary { font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    a { color: var(--brand); text-decoration: underline; }
    @keyframes pulse { 50% { opacity: .35; } }

    /* ── header: 48px surface bar ── */
    header {
      flex: none; height: 48px; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem; padding: 0 1rem;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    header .brand { display: flex; align-items: center; gap: .5rem; font-size: 15px; font-weight: 600; }
    header .spark { color: var(--brand); }
    header .right { display: flex; align-items: center; gap: .75rem; min-width: 0; }
    .chip {
      font: 12px/1.5 var(--font-mono); color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conn { display: flex; align-items: center; gap: .4rem; flex: none; }
    .conn .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
    .conn .cdot.connecting { background: var(--brand); animation: pulse 1.2s ease-in-out infinite; }
    .conn .cdot.open { background: var(--ok); }
    .conn .clabel { color: var(--muted); font-size: 12px; }

    /* ── transcript: one centered 44rem column (spaciousness guard: do not widen) ── */
    main { flex: 1 1 auto; overflow-y: auto; }
    #log { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    #log > :first-child { margin-top: 0; }
    .row { display: grid; grid-template-columns: 1.75rem 1fr; margin-top: .9rem; }
    .row > .g { user-select: none; }
    .row > .body { min-width: 0; overflow-wrap: break-word; }

    .row.user { margin-top: 2.25rem; }
    .row.user > .g { color: var(--brand); font-family: var(--font-mono); font-weight: 600; }
    .row.user > .body { font-weight: 500; color: var(--fg); white-space: pre-wrap; }

    /* assistant marker: an 8px brand dot anchored to the group's first line */
    .row.assistant .adot {
      display: block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand); margin-top: .55em;
    }
    .prose > :first-child { margin-top: 0; }
    .prose p { margin: .55rem 0 0; white-space: pre-wrap; }
    .prose h1, .prose h2, .prose h3 { font-weight: 600; margin: .9em 0 .4em; }
    .prose h1 { font-size: 1.3em; } .prose h2 { font-size: 1.15em; } .prose h3 { font-size: 1em; }
    .prose ul { margin: .55rem 0 0; padding-left: 1.25rem; }
    .prose li::marker { color: var(--muted); }
    .prose code {
      font-family: var(--font-mono); font-size: 86%;
      background: var(--inset); border: 1px solid var(--line-soft);
      border-radius: 4px; padding: .08em .35em;
    }

    .codeblock { position: relative; margin: .55rem 0 0; }
    .codeblock pre {
      margin: 0; padding: .75rem 1rem; overflow-x: auto;
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: 8px;
      font: 13px/1.5 var(--font-mono);
    }
    .codeblock .lang {
      position: absolute; top: .45rem; right: 3.4rem;
      font: 11px/1.5 var(--font-mono); text-transform: uppercase; color: var(--faint);
    }
    .codeblock .copy {
      position: absolute; top: .35rem; right: .5rem;
      font: 11px/1.5 var(--font-mono); color: var(--muted);
      background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
      padding: .1rem .45rem; cursor: pointer;
      opacity: 0; transition: opacity 120ms ease;
    }
    .codeblock:hover .copy, .codeblock .copy:focus-visible { opacity: 1; }

    /* ── tool cards: one <details> per call ── */
    details.tool {
      margin-top: .9rem; background: var(--surface);
      border: 1px solid var(--line); border-radius: 8px;
      font: 13px/1.5 var(--font-mono); overflow: hidden;
    }
    details.tool.err { border-left: 2px solid var(--err); }
    /* Reasoning: its own collapsed region, never the assistant prose group. Dim and
       collapsed by default so a multi-minute scratchpad cannot bury the answer it
       precedes — visible enough to prove the model is working, quiet enough to ignore. */
    details.thinking {
      margin-top: .9rem; background: var(--surface);
      border: 1px solid var(--line); border-radius: 8px;
      font: 13px/1.5 var(--font-mono); overflow: hidden; opacity: .75;
    }
    .thinking summary {
      display: flex; align-items: center; gap: .55rem;
      padding: .5rem .75rem; cursor: pointer; list-style: none; color: var(--muted);
    }
    .thinking summary::-webkit-details-marker { display: none; }
    .thinking .thinking-body {
      padding: 0 .75rem .6rem; color: var(--muted);
      white-space: pre-wrap; max-height: 18rem; overflow-y: auto;
    }
    .tool summary {
      display: flex; align-items: center; gap: .55rem;
      padding: .5rem .75rem; cursor: pointer; list-style: none;
    }
    .tool summary::-webkit-details-marker { display: none; }
    .tool.empty summary { cursor: default; }
    .tool .tdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .tool .tdot.pending { animation: pulse 1.2s ease-in-out infinite; }
    .tool .tdot.fail { background: var(--err); }
    .tool .tname { font-weight: 600; }
    .tool .targs {
      color: var(--muted); flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tool .receipt { color: var(--muted); font-size: 12px; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 45%; }
    .tool .chev { color: var(--faint); transition: transform 120ms ease; }
    details[open] > summary .chev { transform: rotate(90deg); }
    .tool.nochev .chev { display: none; }
    .tool .tool-out {
      margin: 0 .75rem .6rem; padding: .6rem .8rem; max-height: 40vh; overflow: auto;
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: 8px;
      white-space: pre; color: var(--muted); font: 13px/1.5 var(--font-mono);
    }
    .tool.err .tool-out { color: var(--fg); }
    .tool-out div { min-height: 1.5em; }
    /* diff bands bleed across the inset's padding: full-width painted lines */
    .tool-out .add { background: var(--add-bg); color: var(--add-fg); margin: 0 -.8rem; padding: 0 .8rem; }
    .tool-out .del { background: var(--del-bg); color: var(--del-fg); margin: 0 -.8rem; padding: 0 .8rem; }
    .tool-out .dmeta { color: var(--faint); }
    .tool .artifacts {
      margin: 0 .75rem .65rem; display: flex; flex-wrap: wrap; gap: .45rem;
    }
    .artifact-link {
      display: inline-flex; align-items: center; gap: .35rem; max-width: 100%;
      padding: .25rem .55rem; border: 1px solid var(--line-soft); border-radius: 6px;
      background: var(--inset); color: var(--brand); text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .artifact-link .asize { color: var(--muted); }

    /* ── status / consent / turn-receipt rows ── */
    .row.status > .g, .row.consent > .g { color: var(--muted); font-family: var(--font-mono); }
    .row.status > .body { font: italic 12px/1.5 var(--font-mono); color: var(--muted); }
    .row.consent > .body { font: 12px/1.5 var(--font-mono); color: var(--muted); }
    .row.turnend { margin-top: 1rem; }
    .row.turnend > .body { font: 12px/1.5 var(--font-mono); color: var(--muted); }
    .rdot { display: block; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
    .rdot.ok { background: var(--ok); } .rdot.err { background: var(--err); } .rdot.warn { background: var(--warn); }

    .errcard {
      margin-top: .9rem; padding: .6rem .75rem;
      background: var(--surface); border: 1px solid var(--line);
      border-left: 2px solid var(--err); border-radius: 8px;
      font: 13px/1.5 var(--font-mono); color: var(--fg); white-space: pre-wrap;
    }

    /* ── empty state ── */
    #empty { text-align: center; margin-top: 18vh; }
    #empty .spark { font-size: 28px; color: var(--brand); }
    #empty .t { font-size: 20px; font-weight: 600; margin-top: .5rem; }
    #empty .m { margin-top: .4rem; font: 12px/1.5 var(--font-mono); color: var(--muted); }
    #empty .h { margin-top: .6rem; color: var(--muted); }
    #empty .pills { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1.25rem; }
    .pill {
      font: 12px/1.5 var(--font-mono); color: var(--muted);
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
      padding: .35rem .8rem; cursor: pointer; transition: color 120ms ease;
    }
    .pill:hover { color: var(--fg); }

    /* ── dock: overlay + jump pill + approval + composer, all in-column ── */
    .dock { flex: none; position: relative; width: 100%; max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }
    #stream-status {
      position: absolute; bottom: calc(100% + .4rem); left: 0; right: 0; text-align: center;
      pointer-events: none; font: 12px/1.5 var(--font-mono); color: var(--muted);
      opacity: 0; transition: opacity 150ms ease;
    }
    #stream-status.show { opacity: 1; }
    #stream-status .spark { color: var(--brand); }
    #jump {
      position: absolute; bottom: calc(100% + 2.2rem); left: 50%; transform: translateX(-50%);
      font: 12px/1.5 var(--font-mono); color: var(--fg);
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
      padding: .3rem .8rem; box-shadow: var(--shadow); cursor: pointer;
      opacity: 0; visibility: hidden; transition: opacity 150ms ease, visibility 150ms;
    }
    #jump.show { opacity: 1; visibility: visible; }

    #approval {
      margin: 0 1rem .75rem; padding: .75rem .9rem;
      background: var(--surface); border: 1px solid var(--line);
      border-left: 3px solid var(--warn); border-radius: 10px; box-shadow: var(--shadow);
    }
    #approval:not([hidden]) { animation: rise 150ms ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .ap-title { font-weight: 600; }
    .ap-title .ap-tool { margin-left: .5rem; font-weight: 600; font-family: var(--font-mono); font-size: 13px; }
    .ap-detail {
      margin-top: .5rem; padding: .5rem .7rem;
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: 8px;
      font: 13px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .ap-detail .ap-reason { color: var(--muted); }
    .ap-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .65rem; }
    .ap-actions button {
      font: 13px/1.5 var(--font-prose); border-radius: 8px; padding: .35rem .8rem; cursor: pointer;
      background: transparent; color: var(--fg); border: 1px solid var(--line);
      transition: color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    .ap-actions button:active { transform: translateY(1px); }
    .ap-actions .solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .ap-actions #deny:hover { color: var(--err); border-color: var(--err); }
    .ap-actions kbd {
      font: 11px/1.5 var(--font-mono); color: var(--muted);
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: 4px;
      padding: 0 .3em; margin-left: .45em;
    }
    .ap-actions .solid kbd { background: transparent; color: var(--bg); border-color: var(--bg); opacity: .75; }

    /* ── composer: a floating card; Send morphs in place into Stop ── */
    #composer {
      display: flex; align-items: flex-end; gap: .6rem;
      margin: 0 1rem 1rem; padding: .6rem .75rem;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: var(--shadow);
    }
    #composer:focus-within {
      box-shadow: var(--shadow), 0 0 0 2px color-mix(in srgb, var(--brand) 35%, transparent);
    }
    #composer .pglyph {
      color: var(--brand); font-family: var(--font-mono); font-weight: 600;
      padding-bottom: .25rem; user-select: none;
    }
    #attach {
      flex: none; width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      font: 18px/1 var(--font-prose); cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    #attach:hover { color: var(--fg); border-color: var(--brand); transform: translateY(-1px); }
    #attach:disabled { opacity: .5; cursor: default; transform: none; }
    #file-input { display: none; }
    #input {
      flex: 1 1 auto; padding: .25rem 0; background: transparent; border: 0; resize: none;
      color: var(--fg); font: 16px/1.5 var(--font-prose);
      max-height: calc(6 * 1.5em + .5rem); overflow-y: auto;
    }
    #input:focus-visible { outline: none; }   /* the card carries the ring */
    #input::placeholder { color: var(--faint); }
    #send {
      flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%;
      background: var(--fg); color: var(--bg); font-size: 15px; line-height: 1; cursor: pointer;
      transition: border-radius 150ms ease, transform 120ms ease;
    }
    #send:hover { transform: translateY(-1px); }
    #send.stop { border-radius: 8px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0s !important; animation-duration: 0s !important; }
      .tdot.pending, .cdot.connecting { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="spark" aria-hidden="true">✦</span><span>Zak Code</span></div>
    <div class="right">
      <span class="chip" id="chip-model"></span>
      <span class="chip" id="chip-session"></span>
      <span class="conn">
        <span class="cdot connecting" id="conn-dot" aria-hidden="true"></span>
        <span class="clabel" id="conn-label">connecting</span>
      </span>
    </div>
  </header>

  <main id="main">
    <div id="log" aria-live="polite">
      <div id="empty">
        <div class="spark" aria-hidden="true">✦</div>
        <div class="t">Zak Code</div>
        <div class="m" id="empty-meta"></div>
        <div class="h">Ask about this workspace — Zak can read, edit, and run things.</div>
        <div class="pills">
          <button type="button" class="pill">explain this codebase</button>
          <button type="button" class="pill">find a bug and fix it</button>
          <button type="button" class="pill">run the tests and summarize</button>
        </div>
      </div>
    </div>
  </main>

  <div class="dock">
    <div id="stream-status" aria-hidden="true"><span class="spark">✦</span> <span id="status-text"></span></div>
    <button type="button" id="jump">↓ latest</button>
    <div id="approval" role="alertdialog" aria-label="permission required" aria-describedby="approval-detail" hidden>
      <div class="ap-title"><span>Permission</span><span class="ap-tool" id="approval-tool"></span></div>
      <div class="ap-detail" id="approval-detail"></div>
      <div class="ap-actions">
        <button type="button" id="allow-once" class="solid">Allow once <kbd>y</kbd></button>
        <button type="button" id="allow-session">Allow for session <kbd>a</kbd></button>
        <button type="button" id="deny">Deny <kbd>n</kbd></button>
      </div>
    </div>
    <div id="composer">
      <span class="pglyph" aria-hidden="true">›</span>
      <button type="button" id="attach" aria-label="Attach file">+</button>
      <input id="file-input" type="file" multiple />
      <textarea id="input" rows="1" placeholder="Message Zak Code…" autocomplete="off"></textarea>
      <button type="button" id="send" aria-label="Send">↑</button>
    </div>
  </div>

  <script>
  // ── A pure VIEWER + SAY-WRITER: input goes through the say contract (POST /say
  //    writes <workspace>/.say; POST /interrupt writes .interrupt) and the server
  //    runs the turns; this page only renders the full-fidelity watch stream
  //    (GET /watch/current?full=1, SSE). One contract, every surface. All
  //    server/model data reaches the DOM via createElement + textContent only. ────

  // The exact AgentEvent discriminator values this renderer handles. Kept in sync
  // with the server's GET /schema/events (the contract test asserts they match).
  const EVENT_TYPES = ["done", "status", "task_update", "text", "thinking", "tool_call", "tool_result", "usage"];

  // Mirrors the terminal renderer's display names: one short name per known tool.
  const DISPLAY_NAMES = {
    read_file: "Read", write_file: "Write", edit_file: "Edit", list_dir: "List",
    glob: "Glob", grep: "Search", bash: "Run", powershell: "Run",
    read_docx: "Read Word", read_xlsx: "Read Excel", inspect_image: "Inspect Image",
    create_docx: "Word", create_xlsx: "Excel", save_image: "Image",
    create_chart_image: "Chart",
    web_fetch: "Fetch", web_search: "WebSearch", todo_write: "Todo",
    update_plan: "Todo", task: "Task",
  };

  // Mirrors the terminal footer's stop-reason label map (docs/UX.md).
  const STOP_LABELS = {
    completed: "done",
    max_iterations: "stopped early — max iterations",
    provider_error: "provider error",
    doom_loop: "stopped — repeating itself",
    stuck: "stopped — no progress",
    recipe_stalled: "stopped — recipe stalled",
  };

  const CONSENT_LABELS = {
    allow_once: "allowed once",
    allow_session: "allowed for session",
    deny_once: "denied",
  };

  const main = document.getElementById("main");
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const attachBtn = document.getElementById("attach");
  const fileInput = document.getElementById("file-input");
  const sendBtn = document.getElementById("send");
  const jump = document.getElementById("jump");
  const statusEl = document.getElementById("stream-status");
  const statusText = document.getElementById("status-text");
  const approval = document.getElementById("approval");
  const approvalTool = document.getElementById("approval-tool");
  const approvalDetail = document.getElementById("approval-detail");
  const connDot = document.getElementById("conn-dot");
  const connLabel = document.getElementById("conn-label");

  let sessionId = null;
  let lastCursor = null;
  let turnActive = false;
  let turnStart = 0;                            // performance.now() at input send
  let turnUsage = { total_tokens: 0, cost_usd: 0 };  // per-turn accumulator, reset on send
  let assistantBody = null;  // current prose group (re-anchors after tool cards/status)
  let assistantText = "";    // its accumulated raw text (re-rendered on each delta)
  const toolCards = new Map();  // pending tool cards keyed by tool_call id
  let approvedTool = "";     // display name for the consent receipt
  let stick = true;          // stick-to-bottom while within 40px of the bottom
  const MAX_UPLOAD_BYTES = 50 * 1024 * 1024;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function row(cls, gutterNode, bodyNode) {
    const wrap = el("div", "row " + cls);
    const g = el("span", "g");
    if (gutterNode) g.appendChild(gutterNode);
    wrap.appendChild(g);
    bodyNode.classList.add("body");
    wrap.appendChild(bodyNode);
    return wrap;
  }

  function add(node) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();
    log.appendChild(node);
    follow();
    return node;
  }

  function follow() {
    if (stick) main.scrollTop = main.scrollHeight;
    else updateJump();
  }

  function errCard(text) { return el("div", "errcard mono", text); }

  // ── scroll: follow only near the bottom; detached + streaming → jump pill ──
  main.addEventListener("scroll", () => {
    stick = main.scrollHeight - main.scrollTop - main.clientHeight < 40;
    updateJump();
  });
  function updateJump() { jump.classList.toggle("show", !stick && turnActive); }
  jump.onclick = () => { stick = true; main.scrollTop = main.scrollHeight; updateJump(); };

  // ── stream-status overlay: pinned above the composer, never reflows ──
  function setStatus(label) { statusText.textContent = label; statusEl.classList.add("show"); }
  function hideStatus() { statusEl.classList.remove("show"); }

  // ── formatting (mirrors the terminal receipt formats) ──
  function firstLine(text) { return String(text).split("\n")[0]; }

  function squeezeMiddle(text, limit) {
    const s = firstLine(text);
    if (s.length <= limit) return s;
    const keep = limit - 1;
    const head = Math.ceil(keep / 2);
    return s.slice(0, head) + "…" + s.slice(s.length - (keep - head));
  }

  function titleCase(name) {
    return String(name).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
  }

  function displayName(name) { return DISPLAY_NAMES[name] || titleCase(name); }

  function condenseArgs(args) {
    if (!args || typeof args !== "object") return args === undefined || args === null ? "" : squeezeMiddle(String(args), 64);
    if (typeof args.command === "string" && args.command) return "$ " + squeezeMiddle(args.command, 62);
    for (const key of ["path", "file_path", "pattern", "query", "url", "name"]) {
      if (typeof args[key] === "string" && args[key]) return squeezeMiddle(args[key], 64);
    }
    for (const v of Object.values(args)) {
      if (typeof v === "string" && v) return squeezeMiddle(v, 64);
    }
    return squeezeMiddle(JSON.stringify(args), 64);
  }

  function fmtDur(ms) {
    const s = ms / 1000;
    if (s < 60) return s.toFixed(1) + "s";
    return Math.floor(s / 60) + "m " + Math.floor(s % 60) + "s";
  }

  function fmtTokens(n) {
    return n >= 1000 ? (n / 1000).toFixed(1) + "k tokens" : n + " tokens";
  }

  function fmtCost(c) {
    let s = (c || 0).toFixed(4);
    while (s.endsWith("0") && s.split(".")[1].length > 2) s = s.slice(0, -1);
    return "$" + s;
  }

  function fmtBytes(n) {
    n = Number(n || 0);
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }

  function artifactUrl(artifact) {
    return "/sessions/" + encodeURIComponent(sessionId) +
      "/artifacts/" + encodeURIComponent(artifact.id) + "/download";
  }

  function uploadUrl() {
    return "/sessions/" + encodeURIComponent(sessionId) + "/uploads";
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(reader.error || new Error("could not read file"));
      reader.readAsDataURL(file);
    });
  }

  function addUploadPrompt(text) {
    if (!text) return;
    input.value = input.value.trim()
      ? input.value.trimEnd() + "\n\n" + text
      : text;
    autoGrow();
    input.focus();
  }

  async function uploadFiles(files) {
    if (!files || !files.length || turnActive || !sessionId) return;
    attachBtn.disabled = true;
    setStatus("uploading…");
    try {
      for (const file of files) {
        if (file.size > MAX_UPLOAD_BYTES) {
          add(errCard("upload too large: " + file.name + " (" + fmtBytes(file.size) + ")"));
          continue;
        }
        try {
          const data = await readAsDataUrl(file);
          const resp = await fetch(uploadUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: file.name, data }),
          });
          if (!resp.ok) {
            let detail = "HTTP " + resp.status;
            try {
              const body = await resp.json();
              if (body && body.detail) detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
            } catch {}
            add(errCard("upload failed: " + file.name + "\n" + detail));
            continue;
          }
          const uploaded = await resp.json();
          const body = el("div", "meta", "uploaded " + (uploaded.artifact?.filename || file.name) + " → " + uploaded.path);
          add(row("status", el("span", "", "·"), body));
          addUploadPrompt(uploaded.prompt);
        } catch (err) {
          const detail = err && err.message ? err.message : String(err);
          add(errCard("upload failed: " + file.name + "\n" + detail));
        }
      }
    } finally {
      hideStatus();
      attachBtn.disabled = turnActive;
      fileInput.value = "";
      follow();
    }
  }

  // ── assistant prose: re-render the current group on each delta ──
  function inlineSpans(line, target) {
    // Non-nested **bold** / `code`, built with textContent only.
    let i = 0;
    while (i < line.length) {
      if (line.startsWith("**", i)) {
        const end = line.indexOf("**", i + 2);
        if (end !== -1) { target.appendChild(el("strong", "", line.slice(i + 2, end))); i = end + 2; continue; }
      }
      if (line[i] === "`") {
        const end = line.indexOf("`", i + 1);
        if (end !== -1) { target.appendChild(el("code", "", line.slice(i + 1, end))); i = end + 1; continue; }
      }
      let next = line.length;
      const b = line.indexOf("**", i), c = line.indexOf("`", i);
      if (b !== -1) next = Math.min(next, b);
      if (c !== -1) next = Math.min(next, c);
      if (next === i) next = i + 1;
      target.appendChild(document.createTextNode(line.slice(i, next)));
      i = next;
    }
  }

  function codeBlock(lang, text) {
    const wrap = el("div", "codeblock");
    if (lang) wrap.appendChild(el("span", "lang", lang));
    const copy = el("button", "copy", "Copy");
    copy.type = "button";
    copy.onclick = () => {
      if (!navigator.clipboard) { copy.textContent = "Copy failed"; }
      else {
        navigator.clipboard.writeText(text).then(
          () => { copy.textContent = "Copied"; },
          () => { copy.textContent = "Copy failed"; },
        );
      }
      setTimeout(() => { copy.textContent = "Copy"; }, 2000);
    };
    wrap.appendChild(copy);
    wrap.appendChild(el("pre", "mono", text));
    return wrap;
  }

  function renderProse() {
    assistantBody.textContent = "";
    const lines = assistantText.split("\n");
    let i = 0, para = null, list = null;
    while (i < lines.length) {
      const raw = lines[i];
      const fence = raw.trimStart().match(/^```(\S*)/);
      if (fence) {
        para = null; list = null;
        const codeLines = [];
        i += 1;
        while (i < lines.length && !lines[i].trimStart().startsWith("```")) { codeLines.push(lines[i]); i += 1; }
        i += 1;  // closing fence (or stream end)
        assistantBody.appendChild(codeBlock(fence[1], codeLines.join("\n")));
        continue;
      }
      const h = raw.match(/^\s*(#{1,6})\s+(.*)$/);
      if (h) {
        para = null; list = null;
        const head = el("h" + Math.min(h[1].length, 3), "");
        inlineSpans(h[2], head);
        assistantBody.appendChild(head);
        i += 1; continue;
      }
      const b = raw.match(/^\s*[-*]\s+(.*)$/);
      if (b) {
        para = null;
        if (!list) { list = el("ul", ""); assistantBody.appendChild(list); }
        const li = el("li", "");
        inlineSpans(b[1], li);
        list.appendChild(li);
        i += 1; continue;
      }
      if (!raw.trim()) { para = null; list = null; i += 1; continue; }
      list = null;
      if (!para) { para = el("p", ""); assistantBody.appendChild(para); }
      else para.appendChild(document.createTextNode("\n"));
      inlineSpans(raw, para);
      i += 1;
    }
  }

  function onTextDelta(text) {
    if (!assistantBody) {
      assistantText = "";
      assistantBody = el("div", "prose");
      add(row("assistant", el("span", "adot"), assistantBody));
    }
    assistantText += text;
    renderProse();
    follow();
  }

  // ── reasoning ("thinking"): accumulates in its OWN collapsed region ──────────
  // Deliberately NOT routed through onTextDelta: reasoning is the model's scratchpad,
  // not its answer, and appending it to the prose group would corrupt the transcript
  // that gets copied, quoted and saved. Separate event type, separate DOM node.
  let thinkingBody = null;
  let thinkingText = "";
  function onThinkingDelta(text) {
    if (!thinkingBody) {
      thinkingText = "";
      const card = el("details", "thinking");
      card.appendChild(el("summary", "thinking-summary", "thinking…"));
      thinkingBody = el("div", "thinking-body");
      card.appendChild(thinkingBody);
      add(row("assistant", el("span", "adot"), card));
      // Re-anchor prose: text arriving after this must open a NEW group below the
      // reasoning card, never continue one that was open above it.
      assistantBody = null;
    }
    thinkingText += text;
    thinkingBody.textContent = thinkingText;
    follow();
  }

  // ── tool cards: created pending on tool_call, resolved by id on tool_result ──
  function onToolCall(ev) {
    assistantBody = null;
    const name = displayName(ev.name);
    const card = el("details", "tool empty");
    const sum = el("summary", "tool-summary");
    const dot = el("span", "tdot pending");
    const receipt = el("span", "receipt", "…");
    sum.appendChild(dot);
    sum.appendChild(el("span", "tname", name));
    sum.appendChild(el("span", "targs", "(" + condenseArgs(ev.arguments) + ")"));
    sum.appendChild(receipt);
    sum.appendChild(el("span", "chev", "▸"));
    sum.addEventListener("click", (e) => { if (card.classList.contains("empty")) e.preventDefault(); });
    card.appendChild(sum);
    add(card);
    toolCards.set(ev.id, { card, dot, receipt, name, started: performance.now() });
    setStatus("using tools…");
  }

  // Synthesized receipts per display name (docs/UX.md), never raw first lines.
  function receiptText(name, ev, output) {
    if (ev.is_error) return "✗ " + squeezeMiddle(firstLine(output.trim()), 64);
    const n = output.trim() ? output.trim().split("\n").length : 0;
    switch (name) {
      case "Read": case "List": case "Fetch": return n + (n === 1 ? " line" : " lines");
      case "Run": return n ? n + (n === 1 ? " line" : " lines") : "no output";
      case "Search": return n + (n === 1 ? " match" : " matches");
      case "Glob": return n + (n === 1 ? " file" : " files");
      case "Edit": {
        const lines = output.split("\n");
        if (lines.some((l) => l.startsWith("@@"))) {
          const a = lines.filter((l) => l.startsWith("+") && !l.startsWith("+++")).length;
          const d = lines.filter((l) => l.startsWith("-") && !l.startsWith("---")).length;
          return "+" + a + " -" + d;
        }
        return n + (n === 1 ? " line" : " lines");
      }
      case "Write": return "written";
      case "Todo": return n + (n === 1 ? " item" : " items");
      default: return n + (n === 1 ? " line" : " lines");
    }
  }

  function fillOutput(body, output) {
    const lines = output.replace(/\n$/, "").split("\n");
    const isDiff = lines.some((l) => l.startsWith("@@")) ||
      (lines.some((l) => l.startsWith("--- ")) && lines.some((l) => l.startsWith("+++ ")));
    if (!isDiff) { body.textContent = output; return; }
    for (const line of lines) {
      let cls = "";
      if (line.startsWith("@@") || line.startsWith("--- ") || line.startsWith("+++ ")) cls = "dmeta";
      else if (line.startsWith("+")) cls = "add";
      else if (line.startsWith("-")) cls = "del";
      body.appendChild(el("div", cls, line));
    }
  }

  function artifactList(artifacts) {
    const wrap = el("div", "artifacts");
    for (const artifact of artifacts) {
      const link = el("a", "artifact-link");
      link.href = artifactUrl(artifact);
      link.download = artifact.filename || "";
      link.appendChild(el("span", "", artifact.filename || artifact.path || artifact.id));
      link.appendChild(el("span", "asize", fmtBytes(artifact.size)));
      wrap.appendChild(link);
    }
    return wrap;
  }

  function onToolResult(ev) {
    const entry = toolCards.get(ev.tool_use_id);
    const output = String(ev.output || "");
    const artifacts = Array.isArray(ev.artifacts) ? ev.artifacts : [];
    if (!entry) {
      // Reconnect/replay can deliver a result with no card: render it standalone, never throw.
      const body = el("div", "meta", "tool result · " + receiptText("", ev, output));
      add(row("consent", el("span", "", "·"), body));
      if (artifacts.length) add(row("consent", el("span", "", "."), artifactList(artifacts)));
      return;
    }
    toolCards.delete(ev.tool_use_id);
    const dur = fmtDur(performance.now() - entry.started);
    entry.dot.classList.remove("pending");
    if (ev.is_error) { entry.card.classList.add("err"); entry.dot.classList.add("fail"); }
    entry.receipt.textContent = receiptText(entry.name, ev, output) + " · " + dur;
    if (output.trim() || artifacts.length) {
      entry.card.classList.remove("empty");
      if (output.trim()) {
        const body = el("div", "tool-out mono");
        fillOutput(body, output);
        entry.card.appendChild(body);
      }
      if (artifacts.length) entry.card.appendChild(artifactList(artifacts));
      if (ev.is_error) entry.card.open = true;
    } else {
      entry.card.classList.add("nochev");
    }
    setStatus(toolCards.size ? "using tools…" : "thinking…");
    follow();
  }

  // On done / error-frame / interrupt / socket close: nothing may pulse forever.
  function abandonPending() {
    for (const entry of toolCards.values()) {
      entry.dot.classList.remove("pending");
      entry.receipt.textContent = "interrupted";
      entry.card.classList.add("nochev");
    }
    toolCards.clear();
  }

  // ── turn receipt: state-colored dot + the terminal's footer line ──
  function finishTurn(ev) {
    const usage = (ev.usage && ev.usage.total_tokens) ? ev.usage : turnUsage;
    let tone = "warn";
    if (ev.stop_reason === "completed") tone = "ok";
    else if (ev.stop_reason === "provider_error") tone = "err";
    let label = STOP_LABELS[ev.stop_reason] || String(ev.stop_reason || "").replace(/_/g, " ");
    if (ev.stop_reason === "provider_error" && ev.error) label += " — " + firstLine(ev.error);
    const elapsed = ((performance.now() - turnStart) / 1000).toFixed(1);
    const body = el("div", "receipt",
      label + " · " + (ev.iterations || 0) + " iterations · " +
      fmtTokens(usage.total_tokens || 0) + " · " + fmtCost(usage.cost_usd || 0) + " · " + elapsed + "s");
    add(row("turnend", el("span", "rdot " + tone), body));
    endTurn();
  }

  function endTurn() {
    turnActive = false;
    hideStatus();
    setSendMode(false);
    approval.hidden = true;
    abandonPending();
    assistantBody = null;
    // Close the reasoning region too. The "text" case also clears it, but a turn
    // that ends without ever emitting text (tool-only, interrupted, error) would
    // otherwise leave it open and the NEXT turn's thinking would grow the previous
    // turn's card.
    thinkingBody = null;
    updateJump();
  }

  // Render one AgentEvent frame.
  function renderEvent(ev) {
    switch (ev.event) {
      case "text":
        // A real token ends the reasoning phase: close the region so a later
        // thinking phase (after a tool call) opens a fresh one instead of
        // re-growing the previous turn's card.
        thinkingBody = null;
        onTextDelta(ev.text);
        if (toolCards.size === 0) setStatus("writing…");
        return;
      case "thinking":
        onThinkingDelta(ev.text);
        if (toolCards.size === 0) setStatus("thinking…");
        return;
      case "tool_call":
        onToolCall(ev);
        return;
      case "tool_result":
        onToolResult(ev);
        return;
      case "status":
        assistantBody = null;
        add(row("status", el("span", "", "·"), el("div", "meta", ev.message)));
        // The server sends no done frame after a cancel; this status ends the turn.
        if (ev.message === "interrupted") finishTurn({ stop_reason: "interrupted", iterations: 0, usage: turnUsage });
        return;
      case "task_update":
        // The live plan (Zak Code's task list). Render each line as its own row so
        // newlines survive using textContent only (no markup injection). A COMPLETE plan
        // collapses to one line so the finished checklist does not linger under the
        // answer (ADR-0108).
        assistantBody = null;
        {
          const box = el("div", "meta");
          if (ev.complete) {
            const done = (ev.finished || 0) + "/" + (ev.total || 0);
            box.appendChild(el("div", "", "✓ plan complete — " + done + " steps"));
          } else {
            // The request the plan serves rides above the checklist (ADR-0113), the way
            // the loop's own re-injected plan is headed — a reader sees what the steps are FOR.
            if (ev.request) box.appendChild(el("div", "", "Goal: " + ev.request));
            (ev.plan || "").split("\n").forEach((line) => box.appendChild(el("div", "", line)));
          }
          add(row("plan", el("span", "", "☰"), box));
        }
        return;
      case "user_message":
        // Every surface's says arrive here — the page's own sends included (the
        // bus is the one source of truth, so a remote `zakcode say` renders
        // identically to a typed message).
        assistantBody = null;
        thinkingBody = null;
        add(row("user", el("span", "", "›"), el("div", "", ev.text || "")));
        turnActive = true;
        turnStart = performance.now();
        turnUsage = { total_tokens: 0, cost_usd: 0 };
        setSendMode(true);
        setStatus("thinking…");
        stick = true;
        follow();
        return;
      case "session_rotated":
        add(row("status", el("span", "", "·"), el("div", "meta", "session restarted" + (ev.reason ? " — " + ev.reason : ""))));
        endTurn();
        return;
      case "usage":
        if (ev.usage) {
          turnUsage = {
            total_tokens: turnUsage.total_tokens + (ev.usage.total_tokens || 0),
            cost_usd: turnUsage.cost_usd + (ev.usage.cost_usd || 0),
          };
        }
        return;
      case "done":
        finishTurn(ev);
        return;
      default:
        // Unknown event type → surface it rather than silently dropping (contract drift).
        add(errCard("[unknown event: " + JSON.stringify(ev) + "]"));
    }
  }

  // Server → client frames are either an AgentEvent ({event:...}) or a control frame
  // ({type:...}: action_required / error / status).
  function onFrame(frame) {
    if (frame && typeof frame.event === "string") {
      // Any event after action_required means the prompt resolved server-side
      // (e.g. the 120s fail-closed deny) — dismiss a stale card so a late click
      // can never write a false "allowed" consent receipt.
      if (!approval.hidden) { approval.hidden = true; setStatus("thinking…"); }
      renderEvent(frame);
      return;
    }
    switch (frame && frame.type) {
      case "action_required":
        showApproval(frame);
        setStatus("waiting on you");
        break;
      case "error":
        add(errCard("error: " + frame.detail));
        endTurn();
        break;
      case "status":
        assistantBody = null; // re-anchor: later prose must not render above this row
        add(row("status", el("span", "", "·"), el("div", "meta", frame.message)));
        break;
      default:
        add(errCard("[unknown frame: " + JSON.stringify(frame) + "]"));
    }
  }

  // ── approval card: warn-edged, scoped y/a/n keys, consent receipt on decision ──
  function showApproval(frame) {
    approvedTool = displayName(frame.tool_name);
    approvalTool.textContent = approvedTool;
    approvalDetail.textContent = "";
    const args = frame.arguments || {};
    if (typeof args.command === "string" && args.command) {
      approvalDetail.appendChild(el("div", "", "$ " + args.command));
    } else {
      for (const [key, value] of Object.entries(args)) {
        approvalDetail.appendChild(el("div", "", key + "  " + (typeof value === "string" ? value : JSON.stringify(value))));
      }
    }
    if (frame.reason) approvalDetail.appendChild(el("div", "ap-reason", frame.reason));
    approval.hidden = false;
    // Focus the primary action: announces the alertdialog to screen readers and
    // moves focus out of the composer so the advertised y/a/n keys actually work.
    document.getElementById("allow-once").focus();
  }

  const OUTCOME_KEYS = { allow_once: "y", allow_session: "a", deny_once: "n" };
  async function sendApproval(outcome) {
    try {
      const resp = await fetch("/say", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: OUTCOME_KEYS[outcome] }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      // The consent audit trail: a permanent receipt — written only when the
      // decision actually went to the server, so it can never claim a grant
      // the server didn't receive.
      const label = CONSENT_LABELS[outcome] || outcome.replace(/_/g, " ");
      add(row("consent", el("span", "", "·"), el("div", "meta", approvedTool + " — " + label)));
    } catch (e) {
      add(errCard("approval failed: " + e.message));
      return;
    }
    approval.hidden = true;
    setStatus("thinking…");
  }
  document.getElementById("allow-once").onclick = () => sendApproval("allow_once");
  document.getElementById("allow-session").onclick = () => sendApproval("allow_session");
  document.getElementById("deny").onclick = () => sendApproval("deny_once");

  // Scoped: never fires while typing in the composer or any editable element, and
  // never on modified chords — Ctrl/Cmd+A is select-all, not "allow for session".
  document.addEventListener("keydown", (e) => {
    if (approval.hidden) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const a = document.activeElement;
    if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.isContentEditable)) return;
    if (e.key === "y") { e.preventDefault(); sendApproval("allow_once"); }
    else if (e.key === "a") { e.preventDefault(); sendApproval("allow_session"); }
    else if (e.key === "n") { e.preventDefault(); sendApproval("deny_once"); }
  });

  // ── composer: Enter sends, Shift+Enter newline; Send morphs into Stop ──
  function setSendMode(streaming) {
    sendBtn.classList.toggle("stop", streaming);
    sendBtn.textContent = streaming ? "■" : "↑";
    sendBtn.setAttribute("aria-label", streaming ? "Stop" : "Send");
    attachBtn.disabled = streaming;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";  // CSS max-height caps at 6 rows
  }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    // The Enter that commits an IME composition must never send the half-finished
    // message (keyCode 229 covers Safari's isComposing=false commit quirk).
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    try {
      const resp = await fetch("/say", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (resp.status === 429) { setStatus("agent is busy — a message is already pending"); return; }
      if (!resp.ok) throw new Error("HTTP " + resp.status);
    } catch (e) {
      add(errCard("send failed: " + e.message));
      return;
    }
    // The transcript row arrives back on the watch stream as user_message — the
    // one source of truth, shared with every other surface.
    input.value = "";
    autoGrow();
    setStatus("queued…");
  }

  sendBtn.onclick = () => {
    if (turnActive) {
      fetch("/interrupt", { method: "POST" }).catch(() => add(errCard("interrupt failed")));
      return;
    }
    sendMessage();
  };
  attachBtn.onclick = () => {
    if (!turnActive) fileInput.click();
  };
  fileInput.onchange = () => uploadFiles(Array.from(fileInput.files || []));

  // Sample pills prefill the composer (they never send).
  for (const pill of document.querySelectorAll(".pill")) {
    pill.onclick = () => { input.value = pill.textContent; autoGrow(); input.focus(); };
  }

  // ── session bootstrap + socket ──
  function setConn(state, label) {
    connDot.className = "cdot " + state;
    connLabel.textContent = label;
  }

  async function init() {
    setConn("connecting", "connecting");
    try {
      // Join the workspace's CURRENT conversation; create it only if none exists —
      // one workspace, one conversation, shared with every surface.
      let resp = await fetch("/sessions/current");
      if (resp.status === 404) resp = await fetch("/sessions", { method: "POST" });
      if (!resp.ok) throw new Error("session " + resp.status);
      const info = await resp.json();
      sessionId = info.id;
      const id8 = sessionId.slice(0, 8);
      document.getElementById("chip-model").textContent = info.model;
      document.getElementById("chip-session").textContent = id8;
      document.getElementById("empty-meta").textContent = info.model + " · session " + id8;
      watchLoop();
    } catch (e) {
      setConn("closed", "disconnected");
      add(errCard("could not join a session: " + e.message));
    }
  }

  // SSE over fetch (EventSource cannot follow the id/cursor resume contract we
  // need); reconnects forever, resuming after the last seen cursor.
  async function watchLoop() {
    for (;;) {
      try {
        const qs = lastCursor !== null ? "&since=" + encodeURIComponent(lastCursor) : "";
        const resp = await fetch("/watch/" + sessionId + "?full=1" + qs);
        if (!resp.ok) throw new Error("watch " + resp.status);
        setConn("open", "connected");
        await readSse(resp.body, (id, data) => {
          if (id) lastCursor = id;
          try { onFrame(JSON.parse(data)); }
          catch { add(errCard("[bad frame]")); }
        });
      } catch (e) { /* fall through to reconnect */ }
      setConn("connecting", "reconnecting");
      endTurn();
      await new Promise((r) => setTimeout(r, 1500));
    }
  }

  async function readSse(body, onEvent) {
    const reader = body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) return;
      buf += dec.decode(value, { stream: true });
      // sse-starlette frames with \r\n line endings; normalize so the \n\n
      // frame-boundary scan below works. A trailing lone \r (a split \r\n
      // pair) stays in buf and is normalized once its \n arrives.
      buf = buf.replace(/\r\n/g, "\n");
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let id = null, data = "";
        for (const line of chunk.split("\n")) {
          if (line.startsWith("id:")) id = line.slice(3).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (data) onEvent(id, data);
      }
    }
  }

  init();
  </script>
