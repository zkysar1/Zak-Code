<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zak Code</title>
  <style>
    /* ── The Zak look (docs/UX.md): same spatial grammar as the terminal client.
       Gutter glyphs (› · → └ ┄) in a fixed left column, content beside them; one
       blank-line rhythm between blocks; dim reserved for chrome; cyan = active,
       green = ok, red = err, yellow = attention. ─────────────────────────────── */
    :root {
      color-scheme: dark;
      --bg: #0e1116; --panel: #151a23; --line: #242c3b; --code-bg: #131826;
      --fg: #dde3ee; --dim: #828ca1;
      --accent: #6cd1da;   /* cyan: the prompt, the assistant marker, tool verbs   */
      --ok: #8ecf96; --err: #e2697b; --warn: #e0bf76;
      --add: #8ecf96; --del: #e2697b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex; flex-direction: column;
    }

    /* ── header: brand + session facts left, live usage right ── */
    header {
      flex: none; display: flex; align-items: baseline; gap: 1rem;
      padding: .65rem 1.25rem; background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    header .brand { font-weight: 600; color: var(--accent); }
    header .meta { color: var(--dim); font-size: .8rem; flex: 1; min-width: 0;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .usage { color: var(--dim); font-size: .8rem; white-space: nowrap; }

    /* ── the log: one centered, breathable column ── */
    main { flex: 1; overflow-y: auto; }
    #log { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; }
    .block { display: grid; grid-template-columns: 1.6rem 1fr; margin: 1rem 0; }
    .block > .g { color: var(--dim); user-select: none; }
    .block > .body { min-width: 0; overflow-wrap: break-word; }

    .user > .g { color: var(--accent); font-weight: 600; }
    .user > .body { color: var(--fg); white-space: pre-wrap; }

    .assistant > .g { color: var(--accent); }
    .assistant .line { white-space: pre-wrap; min-height: 1.2em; }
    .assistant .line code { color: var(--accent); }
    .assistant .line .b { font-weight: 600; }
    .assistant pre.code {
      margin: .6rem 0; padding: .65rem .9rem; overflow-x: auto;
      background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px;
      white-space: pre;
    }

    /* ── tool block: the call line with its result attached beneath ── */
    .tool { margin: 1rem 0; }
    .tool .call { display: grid; grid-template-columns: 1.6rem 1fr; }
    .tool .call .g { color: var(--dim); user-select: none; }
    .tool .call .verb { color: var(--accent); margin-right: .75rem; }
    .tool .call .target { font-weight: 600; overflow-wrap: anywhere; }
    .tool .result { margin: 0; }
    .tool .result summary, .tool .result .head {
      display: grid; grid-template-columns: 1.6rem 1fr; list-style: none; cursor: pointer;
    }
    .tool .result .head { cursor: default; }
    .tool .result summary::-webkit-details-marker { display: none; }
    .tool .result summary:hover .sum { color: var(--fg); }
    .tool .result .g { color: var(--dim); user-select: none; }
    .tool .result .state.ok { color: var(--ok); }
    .tool .result .state.err { color: var(--err); }
    .tool .result .sum { color: var(--dim); }
    .tool .result pre {
      margin: .35rem 0 0 1.6rem; padding: .55rem .9rem; overflow-x: auto;
      color: var(--dim); background: var(--code-bg);
      border: 1px solid var(--line); border-radius: 6px; white-space: pre;
    }
    .tool .result pre .add { color: var(--add); }
    .tool .result pre .del { color: var(--del); }
    .tool .result.err pre { color: var(--err); border-color: #5a3038; }

    /* ── out-of-band: loop status notices + the live wait indicator ── */
    .status > .g { color: var(--warn); }
    .status > .body { font-style: italic; }
    .thinking { color: var(--dim); font-style: italic; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    /* ── turn footer: the same one-line stats rule the terminal prints ── */
    .turn-rule { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0;
                 color: var(--dim); font-size: .8rem; white-space: nowrap; }
    .turn-rule::before { content: ""; width: 2rem; border-top: 1px solid var(--line); }
    .turn-rule::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
    .stopped { color: var(--warn); }
    .errline { color: var(--err); }

    /* ── permission approval: the terminal's yellow panel, as a bar ── */
    #approval {
      flex: none; display: none; align-items: center; gap: .75rem;
      max-width: 52rem; width: 100%; margin: 0 auto .75rem; padding: .7rem 1rem;
      background: #20202b; border: 1px solid var(--warn); border-radius: 8px;
    }
    #approval.show { display: flex; flex-wrap: wrap; }
    #approval .what { flex: 1; min-width: 14rem; }
    #approval .what .tool-name { font-weight: 600; }
    #approval .what .tier { color: var(--warn); }
    #approval .what .reason { color: var(--dim); display: block; font-size: .85rem; }

    /* ── input bar ── */
    footer { flex: none; background: var(--panel); border-top: 1px solid var(--line); }
    form { display: flex; gap: .6rem; max-width: 52rem; margin: 0 auto; padding: .8rem 1.25rem; }
    .prompt-glyph { color: var(--accent); font-weight: 600; align-self: center; user-select: none; }
    input[type=text] {
      flex: 1; background: var(--bg); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: 6px; padding: .55rem .8rem;
    }
    input[type=text]:focus { outline: none; border-color: var(--accent); }
    button {
      background: var(--accent); color: #0c0f14; border: 0; border-radius: 6px;
      padding: .55rem 1rem; font: inherit; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #2c3445; color: var(--fg); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #stop { display: none; background: #2c3445; color: var(--warn); }
    #stop.show { display: inline-block; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Zak Code</span>
    <span class="meta" id="meta">connecting…</span>
    <span class="usage" id="usage"></span>
  </header>

  <main><div id="log" aria-live="polite"></div></main>

  <div id="approval" role="alertdialog" aria-label="permission required">
    <span class="what" id="approval-what"></span>
    <button id="allow-once">Allow once</button>
    <button id="allow-session" class="secondary">Allow for session</button>
    <button id="deny" class="secondary">Deny</button>
  </div>

  <footer>
    <form id="form">
      <span class="prompt-glyph">›</span>
      <input type="text" id="input" placeholder="Ask Zak Code…" autocomplete="off" />
      <button type="button" id="stop">Stop</button>
      <button type="submit" id="send">Send</button>
    </form>
  </footer>

  <script>
  // ── A thin client: it creates a session, opens the WebSocket, sends user input,
  //    and RENDERS the server's AgentEvent stream. No agent logic lives here. It
  //    speaks the same spatial grammar as the terminal renderer (docs/UX.md). ─────

  // The exact AgentEvent discriminator values this renderer handles. Kept in sync
  // with the server's GET /schema/events (the contract test asserts they match).
  const EVENT_TYPES = ["done", "status", "text", "tool_call", "tool_result", "usage"];

  // Mirrors the terminal renderer's verb map: one short verb per known tool.
  const VERBS = {
    read_file: "read", write_file: "write", edit_file: "edit", list_dir: "list",
    glob: "glob", grep: "grep", bash: "run", powershell: "run",
    web_fetch: "fetch", web_search: "search", todo_write: "todo", task: "task",
  };

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const stopBtn = document.getElementById("stop");
  const meta = document.getElementById("meta");
  const usageEl = document.getElementById("usage");
  const approval = document.getElementById("approval");
  const approvalWhat = document.getElementById("approval-what");

  let ws = null;
  let sessionId = null;
  let turnActive = false;
  let assistantEl = null;    // element rendering the current assistant prose run
  let assistantText = "";    // its accumulated raw text (re-segmented on each delta)
  let lastCall = null;       // {id, verb, el} of the most recent tool-call block
  let turnUsage = null;      // latest cumulative usage event for this turn
  let sessionTokens = 0;     // finished turns' tokens (header adds the live turn)
  let sessionCost = 0;
  let thinkingEl = null;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function append(node) {
    clearThinking();
    log.appendChild(node);
    node.scrollIntoView({ block: "end" });
    return node;
  }

  function block(cls, glyph, bodyNode) {
    const wrap = el("div", "block " + cls);
    wrap.appendChild(el("span", "g", glyph));
    bodyNode.classList.add("body");
    wrap.appendChild(bodyNode);
    return wrap;
  }

  // ── live wait feedback (the terminal's spinner): say WHAT we're waiting for ──
  function showThinking(label) {
    clearThinking();
    thinkingEl = append(el("div", "thinking", "· " + label + "…"));
  }
  function clearThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  // ── assistant prose: re-render the run on each delta, fenced code as blocks ──
  function inlineSpans(line, target) {
    // Non-nested **bold** / `code`, built with textContent (never innerHTML).
    let i = 0;
    while (i < line.length) {
      if (line.startsWith("**", i)) {
        const end = line.indexOf("**", i + 2);
        if (end !== -1) { target.appendChild(el("span", "b", line.slice(i + 2, end))); i = end + 2; continue; }
      }
      if (line[i] === "`") {
        const end = line.indexOf("`", i + 1);
        if (end !== -1) { target.appendChild(el("code", "", line.slice(i + 1, end))); i = end + 1; continue; }
      }
      let next = line.length;
      const b = line.indexOf("**", i), c = line.indexOf("`", i);
      if (b !== -1) next = Math.min(next, b);
      if (c !== -1) next = Math.min(next, c);
      if (next === i) next = i + 1;
      target.appendChild(document.createTextNode(line.slice(i, next)));
      i = next;
    }
  }

  function renderAssistant() {
    assistantEl.textContent = "";
    const lines = assistantText.split("\n");
    let code = null;
    for (const raw of lines) {
      if (raw.trimStart().startsWith("```")) {
        if (code) { code = null; } else { code = el("pre", "code", ""); assistantEl.appendChild(code); }
        continue;
      }
      if (code) { code.textContent += raw + "\n"; continue; }
      const line = el("div", "line");
      let body = raw;
      if (/^\s*[-*] /.test(raw)) { line.appendChild(document.createTextNode("• ")); body = raw.replace(/^\s*[-*] /, ""); }
      else if (/^\s*#+ /.test(raw)) { line.classList.add("b"); body = raw.replace(/^\s*#+ /, ""); }
      inlineSpans(body, line);
      assistantEl.appendChild(line);
    }
  }

  function onTextDelta(text) {
    if (!assistantEl) {
      assistantText = "";
      assistantEl = el("div", "");
      append(block("assistant", "·", assistantEl));
    }
    assistantText += text;
    renderAssistant();
    assistantEl.scrollIntoView({ block: "end" });
  }

  // ── tool blocks: call line + attached result (mirrors `→ verb target` / `└ ✓ …`) ──
  function targetOf(args) {
    if (!args || typeof args !== "object") return String(args ?? "");
    if (typeof args.command === "string" && args.command) return "$ " + abbrev(args.command, 120);
    for (const key of ["path", "file_path", "pattern", "query", "url", "name"]) {
      if (typeof args[key] === "string" && args[key]) return abbrev(args[key], 120);
    }
    for (const v of Object.values(args)) {
      if (typeof v === "string" && v) return abbrev(v, 120);
    }
    return abbrev(JSON.stringify(args), 120);
  }

  function abbrev(text, limit) {
    const first = String(text).split("\n")[0];
    return first.length <= limit ? first : first.slice(0, limit - 1) + "…";
  }

  function onToolCall(ev) {
    assistantEl = null;
    const verb = VERBS[ev.name] || ev.name;
    const wrap = el("div", "tool");
    const call = el("div", "call");
    call.appendChild(el("span", "g", "→"));
    const body = el("span", "");
    body.appendChild(el("span", "verb", verb));
    body.appendChild(el("span", "target", targetOf(ev.arguments)));
    call.appendChild(body);
    wrap.appendChild(call);
    append(wrap);
    lastCall = { id: ev.id, verb, el: wrap };
    showThinking("running " + verb);
  }

  function resultSummary(verb, ev) {
    const out = String(ev.output || "");
    if (verb === "run") {
      if (ev.is_error) return "failed";
      const n = out ? out.split("\n").length : 0;
      return n ? n + (n === 1 ? " line" : " lines") : "no output";
    }
    return abbrev(out.trim(), 80) || (ev.is_error ? "error" : "ok");
  }

  function onToolResult(ev) {
    const attached = lastCall && lastCall.id === ev.tool_use_id;
    const verb = attached ? lastCall.verb : "tool";
    const host = attached ? lastCall.el : append(el("div", "tool"));
    lastCall = null;

    const state = ev.is_error ? "err" : "ok";
    const head = document.createDocumentFragment();
    head.appendChild(el("span", "g", "└"));
    const sumBody = el("span", "");
    sumBody.appendChild(el("span", "state " + state, ev.is_error ? "✗ " : "✓ "));
    if (!attached) sumBody.appendChild(el("span", "sum", verb + " · "));
    sumBody.appendChild(el("span", "sum", resultSummary(verb, ev)));
    head.appendChild(sumBody);

    const out = String(ev.output || "");
    if (out.trim()) {
      // Full output one click away (errors arrive expanded) — the web's answer to
      // the terminal's capped preview: nothing floods, nothing is silently lost.
      const details = el("details", "result " + state);
      if (ev.is_error) details.open = true;
      const summary = el("summary", "");
      summary.appendChild(head);
      details.appendChild(summary);
      details.appendChild(outputPre(out));
      host.appendChild(details);
    } else {
      const lone = el("div", "result " + state);
      const headDiv = el("div", "head");
      headDiv.appendChild(head);
      lone.appendChild(headDiv);
      host.appendChild(lone);
    }
    showThinking("thinking");
  }

  function outputPre(out) {
    const pre = el("pre", "");
    const lines = out.split("\n");
    const isDiff = lines.some((l) => l.startsWith("@@")) ||
      (lines.some((l) => l.startsWith("--- ")) && lines.some((l) => l.startsWith("+++ ")));
    for (const line of lines) {
      if (isDiff && line.startsWith("+")) pre.appendChild(el("span", "add", line + "\n"));
      else if (isDiff && line.startsWith("-")) pre.appendChild(el("span", "del", line + "\n"));
      else pre.appendChild(document.createTextNode(line + "\n"));
    }
    return pre;
  }

  function fmtTokens(n) { return n < 1000 ? n + " tok" : (n / 1000).toFixed(1) + "k tok"; }

  function updateUsageHeader(liveTurnUsage) {
    const tokens = sessionTokens + (liveTurnUsage ? liveTurnUsage.total_tokens : 0);
    const cost = sessionCost + (liveTurnUsage ? liveTurnUsage.cost_usd : 0);
    usageEl.textContent = fmtTokens(tokens) + " · $" + cost.toFixed(4);
  }

  // Render one AgentEvent frame. Returns true if it was a terminal "done" event.
  function renderEvent(ev) {
    switch (ev.event) {
      case "text":
        onTextDelta(ev.text);
        return false;
      case "tool_call":
        onToolCall(ev);
        return false;
      case "tool_result":
        onToolResult(ev);
        return false;
      case "status":
        assistantEl = null;
        append(block("status", "┄", el("span", "", ev.message)));
        if (ev.message === "interrupted") { finishTurn({ stop_reason: "interrupted", iterations: 0, usage: turnUsage }); return true; }
        showThinking("thinking");
        return false;
      case "usage":
        turnUsage = ev.usage;
        updateUsageHeader(ev.usage);
        return false;
      case "done":
        finishTurn(ev);
        return true;
      default:
        // Unknown event type → surface it rather than silently dropping (contract drift).
        append(el("div", "block errline", "[unknown event: " + JSON.stringify(ev) + "]"));
        return false;
    }
  }

  function finishTurn(ev) {
    const usage = (ev.usage && ev.usage.total_tokens) ? ev.usage : (turnUsage || { total_tokens: 0, cost_usd: 0 });
    sessionTokens += usage.total_tokens || 0;
    sessionCost += usage.cost_usd || 0;
    turnUsage = null;
    updateUsageHeader(null);
    if (ev.stop_reason && ev.stop_reason !== "completed") {
      append(el("div", "block stopped", "! stopped early: " + ev.stop_reason));
    }
    const iter = ev.iterations || 0;
    append(el("div", "turn-rule")).appendChild(
      el("span", "", iter + " iter · " + fmtTokens(usage.total_tokens || 0) + " · $" + (usage.cost_usd || 0).toFixed(4))
    );
    endTurn();
  }

  // ── permission approval (the terminal's yellow panel) ──
  function showApproval(frame) {
    approvalWhat.textContent = "";
    approvalWhat.appendChild(el("span", "tool-name", frame.tool_name));
    approvalWhat.appendChild(el("span", "tier", "  (" + frame.tier + ")"));
    if (frame.reason) approvalWhat.appendChild(el("span", "reason", frame.reason));
    approval.classList.add("show");
  }
  function hideApproval() { approval.classList.remove("show"); }

  function sendApproval(outcome) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "approval", outcome }));
    }
    hideApproval();
  }
  document.getElementById("allow-once").onclick = () => sendApproval("allow_once");
  document.getElementById("allow-session").onclick = () => sendApproval("allow_session");
  document.getElementById("deny").onclick = () => sendApproval("deny_once");

  stopBtn.onclick = () => {
    if (ws && ws.readyState === WebSocket.OPEN && turnActive) {
      ws.send(JSON.stringify({ type: "interrupt" }));
    }
  };

  // Server → client frames are either an AgentEvent ({event:...}) or a control frame
  // ({type:...}: action_required / error / status).
  function onFrame(frame) {
    if (frame && typeof frame.event === "string") {
      renderEvent(frame);
      return;
    }
    switch (frame && frame.type) {
      case "action_required": clearThinking(); showApproval(frame); break;
      case "error": append(el("div", "block errline", "error: " + frame.detail)); endTurn(); break;
      case "status": append(block("status", "┄", el("span", "", frame.message))); break;
      default: append(el("div", "block errline", "[unknown frame: " + JSON.stringify(frame) + "]"));
    }
  }

  function endTurn() {
    turnActive = false;
    clearThinking();
    hideApproval();
    sendBtn.disabled = false;
    stopBtn.classList.remove("show");
    input.disabled = false;
    assistantEl = null;
    lastCall = null;
    input.focus();
  }

  async function init() {
    try {
      const resp = await fetch("/sessions", { method: "POST" });
      if (!resp.ok) throw new Error("POST /sessions " + resp.status);
      const info = await resp.json();
      sessionId = info.id;
      meta.textContent = "session " + sessionId.slice(0, 8) + " · " + info.model;
      updateUsageHeader(null);
      openSocket();
    } catch (e) {
      meta.textContent = "offline";
      append(el("div", "block errline", "could not create a session: " + e.message));
    }
  }

  function openSocket() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/${sessionId}`);
    ws.onmessage = (e) => {
      try { onFrame(JSON.parse(e.data)); }
      catch { append(el("div", "block errline", "[bad frame]")); }
    };
    ws.onclose = () => { meta.textContent = "disconnected"; sendBtn.disabled = true; };
    ws.onerror = () => append(el("div", "block errline", "websocket error"));
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || turnActive || !ws || ws.readyState !== WebSocket.OPEN) return;
    append(block("user", "›", el("div", "", text)));
    ws.send(JSON.stringify({ type: "input", message: text }));
    input.value = "";
    turnActive = true;
    sendBtn.disabled = true;
    stopBtn.classList.add("show");
    input.disabled = true;
    showThinking("thinking");
  };

  init();
  </script>
</body>
</html>
