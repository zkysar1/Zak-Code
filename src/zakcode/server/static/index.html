<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zak Code</title>
  <style>
    :root { color-scheme: light dark; --bg:#1e1e2e; --panel:#27293d; --fg:#e6e6f0;
            --dim:#9aa0b4; --accent:#8aadf4; --err:#ed8796; --ok:#a6da95; --tool:#eed49f; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
           background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
    header { padding:.6rem 1rem; background:var(--panel); display:flex; gap:1rem; align-items:center;
             border-bottom:1px solid #00000040; }
    header h1 { font-size:1rem; margin:0; font-weight:600; }
    header .meta { color:var(--dim); font-size:.8rem; }
    #log { flex:1; overflow-y:auto; padding:1rem; }
    .msg { margin:.35rem 0; white-space:pre-wrap; word-break:break-word; }
    .user { color:var(--accent); }
    .assistant { color:var(--fg); }
    .tool-call { color:var(--tool); }
    .tool-result { color:var(--dim); border-left:2px solid #00000030; padding-left:.6rem; }
    .tool-result.err { color:var(--err); border-color:var(--err); }
    .status { color:var(--dim); font-style:italic; }
    .done { color:var(--ok); font-size:.8rem; }
    .err { color:var(--err); }
    .role { color:var(--dim); user-select:none; }
    form { display:flex; gap:.5rem; padding:.75rem 1rem; background:var(--panel);
           border-top:1px solid #00000040; }
    input[type=text] { flex:1; background:var(--bg); color:var(--fg); border:1px solid #00000050;
                       border-radius:6px; padding:.5rem .75rem; font:inherit; }
    button { background:var(--accent); color:#11111b; border:0; border-radius:6px;
             padding:.5rem .9rem; font:inherit; font-weight:600; cursor:pointer; }
    button.secondary { background:#45475a; color:var(--fg); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    #approval { padding:.6rem 1rem; background:#3a2f3f; border-top:1px solid var(--err);
                display:none; gap:.6rem; align-items:center; }
    #approval.show { display:flex; }
    #approval .what { flex:1; }
    #approval code { color:var(--tool); }
  </style>
</head>
<body>
  <header>
    <h1>Zak Code</h1>
    <span class="meta" id="meta">connecting…</span>
  </header>

  <div id="log" aria-live="polite"></div>

  <div id="approval">
    <span class="what" id="approval-what"></span>
    <button id="allow-once">Allow once</button>
    <button id="allow-session" class="secondary">Allow session</button>
    <button id="deny" class="secondary">Deny</button>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="Ask Zak Code…  (a thin renderer of the server's event stream)" autocomplete="off" />
    <button type="submit" id="send">Send</button>
  </form>

  <script>
  // ── A thin client: it creates a session, opens the WebSocket, sends user input,
  //    and RENDERS the server's AgentEvent stream. No agent logic lives here. ──────

  // The exact AgentEvent discriminator values this renderer handles. Kept in sync
  // with the server's GET /schema/events (the contract test asserts they match).
  const EVENT_TYPES = ["done", "status", "text", "tool_call", "tool_result", "usage"];

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const meta = document.getElementById("meta");
  const approval = document.getElementById("approval");
  const approvalWhat = document.getElementById("approval-what");

  let ws = null;
  let sessionId = null;
  let turnActive = false;
  let assistantEl = null; // the element accumulating the current assistant text deltas

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function esc(obj) {
    try { return JSON.stringify(obj); } catch { return String(obj); }
  }

  // Render one AgentEvent frame. Returns true if it was a terminal "done" event.
  function renderEvent(ev) {
    switch (ev.event) {
      case "text":
        if (!assistantEl) assistantEl = add("assistant", "");
        assistantEl.textContent += ev.text;
        log.scrollTop = log.scrollHeight;
        return false;
      case "tool_call":
        add("tool-call", `→ ${ev.name}(${esc(ev.arguments)})`);
        return false;
      case "tool_result": {
        const el = add("tool-result" + (ev.is_error ? " err" : ""),
                       `← ${ev.output}`);
        return false;
      }
      case "status":
        add("status", `· ${ev.message}`);
        return false;
      case "usage":
        meta.textContent = `tokens: ${ev.usage.total_tokens} · cost: $${ev.usage.cost_usd.toFixed(4)}`;
        return false;
      case "done":
        add("done", `done — ${ev.stop_reason} (${ev.iterations} iteration${ev.iterations === 1 ? "" : "s"})`);
        return true;
      default:
        // Unknown event type → surface it rather than silently dropping (contract drift).
        add("err", `[unknown event: ${esc(ev)}]`);
        return false;
    }
  }

  function showApproval(frame) {
    approvalWhat.innerHTML =
      `Permission required for <code>${frame.tool_name}</code> ` +
      `(${frame.tier})${frame.reason ? " — " + frame.reason : ""}`;
    approval.classList.add("show");
  }
  function hideApproval() { approval.classList.remove("show"); }

  function sendApproval(outcome) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "approval", outcome }));
    }
    hideApproval();
  }
  document.getElementById("allow-once").onclick = () => sendApproval("allow_once");
  document.getElementById("allow-session").onclick = () => sendApproval("allow_session");
  document.getElementById("deny").onclick = () => sendApproval("deny_once");

  // Server → client frames are either an AgentEvent ({event:...}) or a control frame
  // ({type:...}: action_required / error / status).
  function onFrame(frame) {
    if (frame && typeof frame.event === "string") {
      const done = renderEvent(frame);
      if (done) endTurn();
      return;
    }
    switch (frame && frame.type) {
      case "action_required": showApproval(frame); break;
      case "error": add("err", `error: ${frame.detail}`); endTurn(); break;
      case "status": add("status", `· ${frame.message}`); break;
      default: add("err", `[unknown frame: ${esc(frame)}]`);
    }
  }

  function endTurn() {
    turnActive = false;
    sendBtn.disabled = false;
    input.disabled = false;
    assistantEl = null;
    input.focus();
  }

  async function init() {
    try {
      const resp = await fetch("/sessions", { method: "POST" });
      if (!resp.ok) throw new Error("POST /sessions " + resp.status);
      const info = await resp.json();
      sessionId = info.id;
      meta.textContent = `session ${sessionId.slice(0, 8)} · ${info.model}`;
      openSocket();
    } catch (e) {
      meta.textContent = "offline";
      add("err", "could not create a session: " + e.message);
    }
  }

  function openSocket() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/${sessionId}`);
    ws.onmessage = (e) => { try { onFrame(JSON.parse(e.data)); } catch { add("err", "[bad frame]"); } };
    ws.onclose = () => { meta.textContent = "disconnected"; sendBtn.disabled = true; };
    ws.onerror = () => add("err", "websocket error");
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || turnActive || !ws || ws.readyState !== WebSocket.OPEN) return;
    add("user", text);
    add("role", "");
    ws.send(JSON.stringify({ type: "input", message: text }));
    input.value = "";
    turnActive = true;
    sendBtn.disabled = true;
    input.disabled = true;
  };

  init();
  </script>
</body>
</html>
