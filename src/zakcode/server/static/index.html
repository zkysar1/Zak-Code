<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zak Code</title>
  <style>
    /* ── The Zak look (docs/UX.md): the terminal grammar in proportional type,
       worn in the Vinheim family's colours (ADR-0218). Every colour lives in
       :root; the family tokens are copied verbatim from the Vinheim design
       system as shipped at vinheim.com, so a member moving between Vinheim and
       this page never changes rooms. One look, dark, all the time — the family
       has no light theme and neither does this page.
       --brand paints only: the spark, the assistant's ● marker, links, the
       connection dot, and the Send button (the family's primary action). Focus
       rings are the family's gold. Boxes are soft surfaces; motion is 120–150ms. */
    :root {
      color-scheme: dark;
      --bg:          oklch(17% .030 258);   /* family paper   */
      --surface:     oklch(21% .032 258);   /* family paper-2 */
      --inset:       oklch(25% .034 258);   /* family paper-3 */
      --line:        oklch(34% .030 258);   /* family line    */
      --line-strong: oklch(42% .034 258);   /* family line-2  */
      --line-soft:   oklch(29% .032 258);   /* between paper-3 and line: insets inside cards */
      --fg:          oklch(96% .010 90);    /* family ink     */
      --muted:       oklch(66% .018 250);   /* family ink-3   */
      --faint:       oklch(54% .018 250);   /* one step under ink-3: urls, tags, placeholders */
      --brand:       oklch(80% .110 195);   /* family accent — Vinheim sea-teal */
      --brand-press: oklch(72% .110 195);   /* family accent-press */
      --on-brand:    oklch(20% .030 258);   /* family on-accent */
      --focus:       oklch(86% .140 85);    /* family focus gold */
      /* The operator's orange (ADR-0186) — deliberately NOT a family token: the
         human's line stays the one warm run of text, as the operator asked. */
      --user:        #f2a53c;
      --ok:          oklch(78% .130 150);   /* family success */
      --err:         oklch(70% .180 25);    /* family danger  */
      --warn:        oklch(82% .140 75);    /* family warning */
      /* diff bands mix the family states into the inset, never a separate hex */
      --add-bg:      color-mix(in oklab, var(--ok) 18%, var(--inset));
      --add-fg:      color-mix(in oklab, var(--ok) 40%, var(--fg));
      --del-bg:      color-mix(in oklab, var(--err) 18%, var(--inset));
      --del-fg:      color-mix(in oklab, var(--err) 40%, var(--fg));
      --shadow:      0 8px 24px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.4);
      /* the family's faces: Fraunces for the two identity moments, carried in the page
         (the @font-face below); Inter for prose when installed, the system's otherwise.
         Nothing is fetched (no CDN) */
      --font-prose:   Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-display: Fraunces, Georgia, "Times New Roman", serif;
      --font-mono:    ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
      --radius:    14px;                    /* family radius: the dock's cards */
      --radius-sm: 9px;                     /* family radius-sm: transcript cards */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.65 var(--font-prose);
      display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    /* one shared rule: streaming digits never jitter */
    .mono, .meta, .receipt, .chip, .tool-summary { font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    a { color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
    @keyframes pulse { 50% { opacity: .35; } }

    /* ── header: 48px bar on the page's own paper, a rule beneath (the family nav) ── */
    header {
      flex: none; height: 48px; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem; padding: 0 1rem;
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    header .brand {
      display: flex; align-items: center; gap: .5rem;
      font: 700 18px/1 var(--font-display); letter-spacing: -.01em;
    }
    header .spark { color: var(--brand); font-size: 15px; }
    header .right { display: flex; align-items: center; gap: .75rem; min-width: 0; }
    .chip {
      font: 12px/1.5 var(--font-mono); color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* the connection state reads like the family's live-status label: a dot and a
       small uppercase word, coloured by state */
    .conn { display: flex; align-items: center; gap: .4rem; flex: none; }
    .conn .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
    .conn .cdot.connecting { background: var(--brand); animation: pulse 1.2s ease-in-out infinite; }
    .conn .cdot.open { background: var(--ok); }
    .conn .clabel {
      color: var(--muted); font-size: 11px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
    }

    /* ── transcript: one centered 44rem column (spaciousness guard: do not widen) ── */
    main { flex: 1 1 auto; overflow-y: auto; }
    #log { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    #log > :first-child { margin-top: 0; }
    .row { display: grid; grid-template-columns: 1.75rem 1fr; margin-top: .9rem; }
    .row > .g { user-select: none; }
    .row > .body { min-width: 0; overflow-wrap: break-word; }

    .row.user { margin-top: 2.25rem; }
    /* the operator's line: the root of the turn and the one warm colour on the page (ADR-0186) */
    .row.user > .g { color: var(--user); font-family: var(--font-mono); font-weight: 700; }
    .row.user > .body { font-weight: 600; color: var(--user); white-space: pre-wrap; }

    /* assistant marker: an 8px brand dot anchored to the group's first line */
    .row.assistant .adot {
      display: block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand); margin-top: .55em;
    }
    .prose > :first-child { margin-top: 0; }
    .prose p { margin: .55rem 0 0; white-space: pre-wrap; }
    .prose h1, .prose h2, .prose h3 { font-weight: 600; margin: .9em 0 .4em; }
    .prose h1 { font-size: 1.3em; } .prose h2 { font-size: 1.15em; } .prose h3 { font-size: 1em; }
    .prose ul { margin: .55rem 0 0; padding-left: 1.25rem; }
    .prose li::marker { color: var(--muted); }
    .prose .quote { margin: .55rem 0 0; color: var(--muted); font-style: italic; white-space: pre-wrap; }
    .prose .link { text-decoration: underline; }
    .prose .linkurl { color: var(--faint); }
    .prose s { color: var(--muted); }
    .prose code {
      font-family: var(--font-mono); font-size: 86%;
      background: var(--inset); border: 1px solid var(--line-soft);
      border-radius: 4px; padding: .08em .35em;
    }

    .codeblock { position: relative; margin: .55rem 0 0; }
    .codeblock pre {
      margin: 0; padding: .75rem 1rem; overflow-x: auto;
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: var(--radius-sm);
      font: 13px/1.5 var(--font-mono);
    }
    .codeblock .lang {
      position: absolute; top: .45rem; right: 3.4rem;
      font: 11px/1.5 var(--font-mono); text-transform: uppercase; color: var(--faint);
    }
    .codeblock .copy {
      position: absolute; top: .35rem; right: .5rem;
      font: 11px/1.5 var(--font-mono); color: var(--muted);
      background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
      padding: .1rem .45rem; cursor: pointer;
      opacity: 0; transition: opacity 120ms ease;
    }
    .codeblock:hover .copy, .codeblock .copy:focus-visible { opacity: 1; }

    /* ── tool cards: the terminal's tool block on a soft surface (docs/UX.md) ──
       The call line, the receipt on a line of its own beneath it (the terminal's └
       receipt), then the rows the terminal draws behind its rail, at its caps. The
       summary is a <details> toggle for the WHOLE output: opening it swaps the preview
       for the full text, so nothing the terminal shows is hidden and nothing more is
       shown until asked for. */
    .tool {
      margin-top: .9rem; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      font: 13px/1.5 var(--font-mono); overflow: hidden;
    }
    .tool.err { border-left: 2px solid var(--err); }
    /* Reasoning: its own collapsed region, never the assistant prose group. Dim and
       collapsed by default so a multi-minute scratchpad cannot bury the answer it
       precedes — visible enough to prove the model is working, quiet enough to ignore. */
    details.thinking {
      margin-top: .9rem; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      font: 13px/1.5 var(--font-mono); overflow: hidden; opacity: .75;
    }
    .thinking summary {
      display: flex; align-items: center; gap: .55rem;
      padding: .5rem .75rem; cursor: pointer; list-style: none; color: var(--muted);
    }
    .thinking summary::-webkit-details-marker { display: none; }
    .thinking .thinking-body {
      padding: 0 .75rem .6rem; color: var(--muted);
      white-space: pre-wrap; max-height: 18rem; overflow-y: auto;
    }
    .tool summary { display: block; padding: .5rem .75rem; list-style: none; cursor: default; }
    .tool summary::-webkit-details-marker { display: none; }
    .tool.expandable summary { cursor: pointer; }
    /* The call line wraps rather than truncates: the terminal shows a command's first 160
       characters and any other argument's first 96, and so does this. */
    .tool .call { display: flex; align-items: flex-start; gap: .55rem; }
    .tool .tdot {
      flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
      margin-top: .45em;   /* centred on the first line, however many the call wraps to */
    }
    .tool .tdot.pending { animation: pulse 1.2s ease-in-out infinite; }
    .tool .tdot.fail { background: var(--err); }
    .tool .tname { flex: none; font-weight: 600; }
    /* a leaf text cell, never a container: `anywhere` shrinks min-content to one
       character, which is right for a path and wrong for a control (rb-10523) */
    .tool .targs {
      flex: 1 1 0; min-width: 0; color: var(--muted);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .tool .chev { display: none; flex: none; color: var(--faint); transition: transform 120ms ease; }
    .tool.expandable .chev { display: block; }
    .tool details[open] .chev { transform: rotate(90deg); }
    .tool .receipt {
      display: block; padding-left: calc(8px + .55rem); color: var(--muted); font-size: 12px;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .tool .tool-out {
      margin: 0 .75rem .6rem; padding: .5rem .8rem; max-height: 40vh; overflow: auto;
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: 6px;
      white-space: pre; color: var(--muted); font: 13px/1.5 var(--font-mono);
    }
    /* the preview is the terminal's rail; an open card shows the whole output in its place */
    .tool details[open] ~ .preview { display: none; }
    /* a failure's rows are shown, not dimmed: the terminal's err.body is the default fg */
    .tool.err .tool-out { color: var(--fg); }
    .tool-out div { min-height: 1.5em; }
    /* diff bands bleed across the inset's padding: full-width painted lines */
    .tool-out .add { background: var(--add-bg); color: var(--add-fg); margin: 0 -.8rem; padding: 0 .8rem; }
    .tool-out .del { background: var(--del-bg); color: var(--del-fg); margin: 0 -.8rem; padding: 0 .8rem; }
    .tool-out .dmeta { color: var(--faint); }
    .tool-out .todo-done > span { color: var(--ok); }
    /* The terminal's result.more row: what the preview left out, said out loud. Here it is
       also the way in — a button that opens the card on the whole output. */
    .tool-out button.more {
      all: unset; display: block; min-height: 1.5em; cursor: pointer;
      color: var(--faint); font-style: italic;
    }
    .tool-out button.more:hover { color: var(--muted); }
    .tool-out button.more:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .tool .artifacts {
      margin: 0 .75rem .65rem; display: flex; flex-wrap: wrap; gap: .45rem;
    }
    .artifact-link {
      display: inline-flex; align-items: center; gap: .35rem; max-width: 100%;
      padding: .25rem .55rem; border: 1px solid var(--line-soft); border-radius: 6px;
      background: var(--inset); color: var(--brand); text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .artifact-link .asize { color: var(--muted); }

    /* ── status / consent / turn-receipt rows ── */
    .row.status > .g, .row.consent > .g { color: var(--muted); font-family: var(--font-mono); }
    .row.status > .body { font: italic 12px/1.5 var(--font-mono); color: var(--muted); }
    /* A plan the harness changed (ADR-0112): the terminal's one line, progress and the step
       in hand; the checklist, headed by the request it serves, opens beneath it. */
    .row.plan > .g { color: var(--muted); font-family: var(--font-mono); }
    .row.plan summary {
      list-style: none; cursor: pointer; font: 12px/1.5 var(--font-mono); color: var(--muted);
      overflow-wrap: anywhere;
    }
    .row.plan summary::-webkit-details-marker { display: none; }
    .row.plan .checklist {
      margin-top: .35rem; padding: .5rem .8rem; overflow-x: auto;
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: 6px;
      font: 12px/1.5 var(--font-mono); color: var(--muted); white-space: pre;
    }
    /* the operator line's stamp and fold, grey like the terminal's user.meta */
    .row.user .umeta { color: var(--muted); font-weight: 400; }
    .row.user button.ufold {
      all: unset; cursor: pointer; color: var(--muted); font-weight: 400; font-style: italic;
    }
    .row.user button.ufold:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .row.consent > .body { font: 12px/1.5 var(--font-mono); color: var(--muted); }
    .row.turnend { margin-top: 1rem; }
    .row.turnend > .body { font: 12px/1.5 var(--font-mono); color: var(--muted); }
    .rdot { display: block; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
    .rdot.ok { background: var(--ok); } .rdot.err { background: var(--err); } .rdot.warn { background: var(--warn); }

    .errcard {
      margin-top: .9rem; padding: .6rem .75rem;
      background: var(--surface); border: 1px solid var(--line);
      border-left: 2px solid var(--err); border-radius: var(--radius-sm);
      font: 13px/1.5 var(--font-mono); color: var(--fg); white-space: pre-wrap;
    }

    /* ── empty state ── */
    #empty { text-align: center; margin-top: 18vh; }
    #empty .spark { font-size: 28px; color: var(--brand); }
    /* the name in the family's display face — one of the two identity moments */
    #empty .t {
      font: 600 30px/1.1 var(--font-display); letter-spacing: -.012em; margin-top: .6rem;
    }
    #empty .m { margin-top: .5rem; font: 12px/1.5 var(--font-mono); color: var(--muted); }
    #empty .h { margin-top: .6rem; color: var(--muted); }
    #empty .pills { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-top: 1.25rem; }
    .pill {
      font: 12px/1.5 var(--font-mono); color: var(--muted);
      background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px;
      padding: .35rem .8rem; cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease;
    }
    .pill:hover { color: var(--fg); border-color: var(--brand); }

    /* ── dock: overlay + jump pill + approval + composer, all in-column ── */
    .dock { flex: none; position: relative; width: 100%; max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }
    #stream-status {
      position: absolute; bottom: calc(100% + .4rem); left: 0; right: 0; text-align: center;
      pointer-events: none; font: 12px/1.5 var(--font-mono); color: var(--muted);
      opacity: 0; transition: opacity 150ms ease;
    }
    #stream-status.show { opacity: 1; }
    #stream-status .spark { color: var(--brand); }
    #jump {
      position: absolute; bottom: calc(100% + 2.2rem); left: 50%; transform: translateX(-50%);
      font: 12px/1.5 var(--font-mono); color: var(--fg);
      background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px;
      padding: .3rem .8rem; box-shadow: var(--shadow); cursor: pointer;
      opacity: 0; visibility: hidden; transition: opacity 150ms ease, visibility 150ms;
    }
    #jump.show { opacity: 1; visibility: visible; }

    #approval {
      margin: 0 1rem .75rem; padding: .8rem .95rem;
      background: var(--surface); border: 1px solid var(--line);
      border-left: 3px solid var(--warn); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    #approval:not([hidden]) { animation: rise 150ms ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .ap-title { display: flex; align-items: baseline; font-weight: 600; }
    /* "Permission" is a label, not a heading: the family's small uppercase eyebrow,
       in the warn colour the terminal's permission panel title wears */
    .ap-title > span:first-child {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--warn);
    }
    .ap-title .ap-tool { margin-left: .6rem; font-weight: 600; font-family: var(--font-mono); font-size: 13px; }
    .ap-detail {
      margin-top: .5rem; padding: .5rem .7rem;
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: 6px;
      font: 13px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .ap-detail .ap-reason { color: var(--muted); }
    .ap-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .7rem; }
    /* the family's pill buttons; Allow once stays a neutral inversion, never brand —
       a consent choice is not a call to action */
    .ap-actions button {
      font: 600 13px/1.4 var(--font-prose); border-radius: 999px; padding: .4rem .95rem; cursor: pointer;
      background: transparent; color: var(--fg); border: 1px solid var(--line-strong);
      transition: color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    .ap-actions button:active { transform: translateY(1px); }
    .ap-actions .solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .ap-actions #allow-session:hover { color: var(--brand); border-color: var(--brand); }
    .ap-actions #deny:hover { color: var(--err); border-color: var(--err); }
    .ap-actions kbd {
      font: 11px/1.5 var(--font-mono); color: var(--muted);
      background: var(--inset); border: 1px solid var(--line-soft); border-radius: 4px;
      padding: 0 .3em; margin-left: .45em;
    }
    .ap-actions .solid kbd { background: transparent; color: var(--bg); border-color: var(--bg); opacity: .75; }

    /* ── composer: a floating card dressed as the family's input; Send morphs in
       place into Stop ── */
    #composer {
      display: flex; align-items: flex-end; gap: .6rem;
      margin: 0 1rem 1rem; padding: .6rem .75rem;
      background: var(--inset); border: 1px solid var(--line-strong);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    #composer:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
    /* the human's chevron is orange on every door (ADR-0186) — the terminal's
       prompt.marker, the transcript's operator line, and this */
    #composer .pglyph {
      color: var(--user); font-family: var(--font-mono); font-weight: 700;
      padding-bottom: .25rem; user-select: none;
    }
    #attach {
      flex: none; width: 34px; height: 34px; border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
      font: 18px/1 var(--font-prose); cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    #attach:hover { color: var(--fg); border-color: var(--brand); transform: translateY(-1px); }
    #attach:disabled { opacity: .5; cursor: default; transform: none; }
    #file-input { display: none; }
    #input {
      flex: 1 1 auto; padding: .25rem 0; background: transparent; border: 0; resize: none;
      color: var(--fg); font: 16px/1.5 var(--font-prose);
      max-height: calc(6 * 1.5em + .5rem); overflow-y: auto;
    }
    #input:focus-visible { outline: none; }   /* the card carries the ring */
    #input::placeholder { color: var(--faint); }
    /* Send is the page's one primary action, so it wears the family's primary
       button: accent fill, navy glyph, a deeper accent under the pointer */
    #send {
      flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%;
      background: var(--brand); color: var(--on-brand);
      font-size: 15px; font-weight: 700; line-height: 1; cursor: pointer;
      transition: border-radius 150ms ease, transform 120ms ease, background 120ms ease;
    }
    #send:hover { background: var(--brand-press); transform: translateY(-1px); }
    #send.stop { border-radius: var(--radius-sm); }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0s !important; animation-duration: 0s !important; }
      .tdot.pending, .cdot.connecting { animation: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="spark" aria-hidden="true">✦</span><span>Zak Code</span></div>
    <div class="right">
      <span class="chip" id="chip-model"></span>
      <span class="chip" id="chip-session"></span>
      <span class="conn">
        <span class="cdot connecting" id="conn-dot" aria-hidden="true"></span>
        <span class="clabel" id="conn-label">connecting</span>
      </span>
    </div>
  </header>

  <main id="main">
    <div id="log" aria-live="polite">
      <div id="empty">
        <div class="spark" aria-hidden="true">✦</div>
        <div class="t">Zak Code</div>
        <div class="m" id="empty-meta"></div>
        <div class="h">Ask about this workspace — Zak can read, edit, and run things.</div>
        <div class="pills">
          <button type="button" class="pill">explain this codebase</button>
          <button type="button" class="pill">find a bug and fix it</button>
          <button type="button" class="pill">run the tests and summarize</button>
        </div>
      </div>
    </div>
  </main>

  <div class="dock">
    <div id="stream-status" aria-hidden="true"><span class="spark">✦</span> <span id="status-text"></span></div>
    <button type="button" id="jump">↓ latest</button>
    <div id="approval" role="alertdialog" aria-label="permission required" aria-describedby="approval-detail" hidden>
      <div class="ap-title"><span>Permission</span><span class="ap-tool" id="approval-tool"></span></div>
      <div class="ap-detail" id="approval-detail"></div>
      <div class="ap-actions">
        <button type="button" id="allow-once" class="solid">Allow once <kbd>y</kbd></button>
        <button type="button" id="allow-session">Allow for session <kbd>a</kbd></button>
        <button type="button" id="deny">Deny <kbd>n</kbd></button>
      </div>
    </div>
    <div id="composer">
      <span class="pglyph" aria-hidden="true">›</span>
      <button type="button" id="attach" aria-label="Attach file">+</button>
      <input id="file-input" type="file" multiple />
      <textarea id="input" rows="1" placeholder="Message Zak Code…" autocomplete="off"></textarea>
      <button type="button" id="send" aria-label="Send">↑</button>
    </div>
  </div>

  <script>
  // ── A pure VIEWER + SAY-WRITER: input goes through the say contract (POST /say
  //    writes <workspace>/.say; POST /interrupt writes .interrupt) and the server
  //    runs the turns; this page only renders the full-fidelity watch stream
  //    (GET /watch/current?full=1, SSE). One contract, every surface. All
  //    server/model data reaches the DOM via createElement + textContent only. ────

  // The exact AgentEvent discriminator values this renderer handles. Kept in sync
  // with the server's GET /schema/events (the contract test asserts they match).
  const EVENT_TYPES = ["done", "status", "task_update", "text", "thinking", "tool_call", "tool_result", "usage"];

  // The terminal renderer's display names (render.py _DISPLAY_NAME — the contract test holds
  // every one of its rows here), then the office tools only this page draws. The first row
  // is the canonical Claude Code names (ADR-0190): the loop canonicalizes every call, so
  // these are what the stream carries; the snake_case rows keep an older transcript's names.
  const DISPLAY_NAMES = {
    Read: "Read", Write: "Write", Edit: "Edit", LS: "List", Glob: "Glob", Grep: "Search",
    Bash: "Run", WebFetch: "Fetch", WebSearch: "WebSearch", ScheduleWakeup: "WakeUp",
    read_file: "Read", write_file: "Write", edit_file: "Edit", list_dir: "List",
    glob: "Glob", grep: "Search", bash: "Run", powershell: "Run",
    web_fetch: "Fetch", web_search: "WebSearch", todo_write: "Todo",
    update_plan: "Todo", task: "Task", schedule_wakeup: "WakeUp",
    read_docx: "Read Word", read_xlsx: "Read Excel", inspect_image: "Inspect Image",
    create_docx: "Word", create_xlsx: "Excel", save_image: "Image",
    create_chart_image: "Chart",
  };

  const CONSENT_LABELS = {
    allow_once: "allowed once",
    allow_session: "allowed for session",
    deny_once: "denied",
  };

  const main = document.getElementById("main");
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const attachBtn = document.getElementById("attach");
  const fileInput = document.getElementById("file-input");
  const sendBtn = document.getElementById("send");
  const jump = document.getElementById("jump");
  const statusEl = document.getElementById("stream-status");
  const statusText = document.getElementById("status-text");
  const approval = document.getElementById("approval");
  const approvalTool = document.getElementById("approval-tool");
  const approvalDetail = document.getElementById("approval-detail");
  const connDot = document.getElementById("conn-dot");
  const connLabel = document.getElementById("conn-label");

  let sessionId = null;
  let lastCursor = null;
  let turnActive = false;
  let turnAt = null;                            // the turn's user_message publish stamp
  let turnUsage = emptyUsage();                 // per-turn accumulator, reset on send
  let lastPlanKey = "";      // checklist rows of the last plan drawn (ADR-0112 dedup)
  let assistantBody = null;  // current prose group (re-anchors after tool cards/status)
  let assistantText = "";    // its accumulated raw text (re-rendered on each delta)
  const toolCards = new Map();  // pending tool cards keyed by tool_call id
  let approvedTool = "";     // display name for the consent receipt
  let stick = true;          // stick-to-bottom while within 40px of the bottom
  const MAX_UPLOAD_BYTES = 50 * 1024 * 1024;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function row(cls, gutterNode, bodyNode) {
    const wrap = el("div", "row " + cls);
    const g = el("span", "g");
    if (gutterNode) g.appendChild(gutterNode);
    wrap.appendChild(g);
    bodyNode.classList.add("body");
    wrap.appendChild(bodyNode);
    return wrap;
  }

  function add(node) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();
    log.appendChild(node);
    follow();
    return node;
  }

  function follow() {
    if (stick) main.scrollTop = main.scrollHeight;
    else updateJump();
  }

  function errCard(text) { return el("div", "errcard mono", text); }

  // The operator's line as the terminal draws it (ADR-0185, ADR-0119): the text, the wall
  // clock grey at the end of its first line, and a long message folded after six lines,
  // the rest one click away rather than a paste burying the turn.
  const USER_FOLD_LINES = 6;
  function userBody(text, at) {
    const body = el("div", "");
    const lines = text.split("\n");
    body.appendChild(document.createTextNode(lines[0]));
    body.appendChild(el("span", "umeta", "  (" + hhmm(at) + ")"));
    const shown = lines.slice(1, USER_FOLD_LINES);
    if (shown.length) body.appendChild(document.createTextNode("\n" + shown.join("\n")));
    const hidden = lines.length - USER_FOLD_LINES;
    if (hidden > 0) {
      const fold = el("button", "ufold", "… (+" + hidden + " more line" + (hidden === 1 ? "" : "s") + ")");
      fold.type = "button";
      fold.onclick = () => fold.replaceWith(document.createTextNode(lines.slice(USER_FOLD_LINES).join("\n")));
      body.appendChild(document.createTextNode("\n"));
      body.appendChild(fold);
    }
    return body;
  }

  // ── scroll: follow only near the bottom; detached + streaming → jump pill ──
  main.addEventListener("scroll", () => {
    stick = main.scrollHeight - main.scrollTop - main.clientHeight < 40;
    updateJump();
  });
  function updateJump() { jump.classList.toggle("show", !stick && turnActive); }
  jump.onclick = () => { stick = true; main.scrollTop = main.scrollHeight; updateJump(); };

  // ── stream-status overlay: pinned above the composer, never reflows ──
  function setStatus(label) { statusText.textContent = label; statusEl.classList.add("show"); }
  function hideStatus() { statusEl.classList.remove("show"); }

  // ── the terminal's grammar, ported line for line ────────────────────────────────
  // One contract, two renderers (docs/UX.md rules 8-13, ADR-0219): every constant and branch
  // in this block mirrors src/zakcode/cli/render.py, so a turn reads the same, at the same
  // length, here and in the terminal — the call line, the receipt, the rows under it, the
  // plan line and the footer. PURE (strings in, strings and rows out; no DOM, no clock) so
  // tests/test_webclient_parity.py runs it under node and compares it, case by case, with
  // the terminal renderer's own output.
  // BEGIN terminal-grammar
  const RUN_CAP = 12, RUN_HEAD = 6, RUN_TAIL = 4;   // Run/Fetch: every line, or head + tail
  const DIFF_PREVIEW_LINES = 12;                    // an Edit's diff rows, then a count
  const LIST_PREVIEW_LINES = 5;                     // Search/Glob rows, then "… +N more"
  const ERROR_DETAIL_LINES = 8;                     // a failure's detail rows
  const ARG_LIMIT = 96, COMMAND_LIMIT = 160;        // the call line's argument (ADR-0185)
  const PLAN_ROW = /^\[[ x~!-]\] \d/;               // a checklist ROW, not any bracketed line
  const PLAN_HEADER = /Current plan \((\d+)\/(\d+) steps done\)/;
  const STOP_LABELS = {
    completed: "done",
    max_iterations: "stopped early — max iterations",
    provider_error: "provider error",
    doom_loop: "stopped — repeating itself",
    stuck: "stopped — no progress",
    gave_up: "stopped — gave up (no output)",
    recipe_stalled: "stopped — recipe stalled",
    skill_too_large: "stopped — skill too large for this model's window",
    veto_stall: "stopped — re-entry stalled: the stop hook kept asking for a skill that never ran",
    awaiting_user: "waiting for you — answer to continue",
    restart: "restarting — a newer build is installed; this session resumes there",
  };

  // Python's str.splitlines(): every boundary it knows, and no empty line after the last.
  function splitLines(text) {
    const lines = String(text).split(/\r\n|[\n\r\v\f\x1c\x1d\x1e\x85\u2028\u2029]/);
    if (lines[lines.length - 1] === "") lines.pop();
    return lines;
  }
  function firstLine(text) {
    const s = String(text);
    return s.includes("\n") ? splitLines(s)[0] : s;
  }
  function plural(n, noun, many) { return n + " " + (n === 1 ? noun : (many || noun + "s")); }
  // Lengths count characters, not UTF-16 halves, as Python's do.
  // Middle-truncate: a command or a query keeps its head AND its tail.
  function squeezeMiddle(text, limit) {
    const chars = Array.from(text);
    if (chars.length <= limit) return text;
    const head = Math.floor((limit - 1) / 2);
    return chars.slice(0, head).join("") + "…" + chars.slice(chars.length - (limit - 1 - head)).join("");
  }
  // Left-truncate: a path keeps its filename.
  function squeezePath(path, limit) {
    const chars = Array.from(path);
    return chars.length <= limit ? path : "…" + chars.slice(chars.length - (limit - 1)).join("");
  }

  // The call line's argument, condensed as the terminal condenses it: a command (after "$ ")
  // keeps 160 characters and anything else 96; a search reads "pattern in scope".
  function condenseArgs(args) {
    if (!args || typeof args !== "object" || Array.isArray(args)) {
      return args === undefined || args === null ? "" : squeezeMiddle(firstLine(String(args)), ARG_LIMIT);
    }
    const str = (v) => typeof v === "string" && v !== "";
    if (str(args.command)) return "$ " + squeezeMiddle(firstLine(args.command), COMMAND_LIMIT);
    if (str(args.pattern)) {
      const scope = ["glob", "path"].map((k) => args[k]).find(str);
      return squeezeMiddle(firstLine(scope ? args.pattern + " in " + scope : args.pattern), ARG_LIMIT);
    }
    const path = ["path", "file_path"].map((k) => args[k]).find(str);
    if (path) return squeezePath(path, ARG_LIMIT);
    const named = ["query", "url", "name"].map((k) => args[k]).find(str);
    if (named) return squeezeMiddle(firstLine(named), ARG_LIMIT);
    const any = Object.values(args).find(str);
    return any ? squeezeMiddle(firstLine(any), ARG_LIMIT) : "";
  }

  function planRows(lines) { return lines.map((l) => l.trim()).filter((l) => PLAN_ROW.test(l)); }
  // The identity of a drawn plan (ADR-0112): its checklist rows. An update_plan card and a
  // task_update share it, so the same plan is never drawn twice.
  function planKey(lines) { return planRows(lines).join("\n"); }
  function stepLabel(row) { return row.replace(/^\[.\]\s*/, "").split("<- current").join("").trim(); }

  // An Edit's diff rows, only for a real unified diff (an @@ hunk, or a ---/+++ header pair):
  // output whose lines merely START with + or - is never painted as one.
  function diffPreview(lines) {
    const hunk = lines.some((l) => l.startsWith("@@"));
    const headers = lines.some((l) => l.startsWith("--- ")) && lines.some((l) => l.startsWith("+++ "));
    if (!(hunk || headers)) return null;
    if (lines.filter((l) => ["+", "-", "@"].includes(l.charAt(0))).length < 2) return null;
    const rows = lines.slice(0, DIFF_PREVIEW_LINES).map((l) => ({
      cls: l.startsWith("@@") || l.startsWith("---") || l.startsWith("+++") ? "dmeta"
        : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "ctx",
      text: l,
    }));
    if (lines.length > DIFF_PREVIEW_LINES) {
      rows.push({ cls: "more", text: "… +" + plural(lines.length - DIFF_PREVIEW_LINES, "line") });
    }
    return rows;
  }

  // The plan collapse (ADR-0108, ADR-0124): a finished plan is one line, a partial one its
  // progress and the step in hand; a list without checklist rows draws every row.
  function planView(lines) {
    const steps = planRows(lines);
    if (steps.length && steps.every((s) => s.startsWith("[x] ") || s.startsWith("[-] "))) {
      return { receipt: "Plan complete · " + plural(steps.length, "step"), rows: [], whole: false };
    }
    if (steps.length) {
      const head = PLAN_HEADER.exec(lines.join("\n"));
      let receipt = "Plan · " + (head ? head[1] + "/" + head[2] + " steps" : plural(steps.length, "step"));
      const current = steps.find((s) => s.includes("<- current")) || steps.find((s) => s.startsWith("[~] "));
      if (current) receipt += " · current: " + Array.from(stepLabel(current)).slice(0, 80).join("");
      return { receipt, rows: [], whole: false };
    }
    const items = lines.filter((l) => l.trim()).length;
    return { receipt: "Plan · " + plural(items, "item"), rows: lines.map(todoRow), whole: true };
  }
  function todoRow(line) {
    if (line.startsWith("[x] ")) return { cls: "todo-done", text: "✓ " + line.slice(4) };
    if (line.startsWith("[ ] ")) return { cls: "todo-open", text: "○ " + line.slice(4) };
    return { cls: "out", text: line };
  }

  // A finished call as the terminal draws it: the receipt (without the outcome mark — the
  // card's dot is the mark) and the rows under it, [{cls, text}] with cls one of out, more,
  // err, add, del, dmeta, ctx, todo-done, todo-open. `whole` says the receipt and rows show
  // every line of the output, so the card has nothing more to open onto.
  function toolView(name, output, isError) {
    const lines = splitLines(output);
    const n = lines.length;
    const out = (list) => list.map((text) => ({ cls: "out", text }));
    if (isError) {
      // Errors restructure, not just recolor: the first line is the receipt, detail follows.
      const rows = lines.slice(1, 1 + ERROR_DETAIL_LINES).map((text) => ({ cls: "err", text }));
      const hidden = n - 1 - ERROR_DETAIL_LINES;
      if (hidden > 0) rows.push({ cls: "more", text: "… +" + plural(hidden, "line") });
      return { receipt: "✗ " + (n ? lines[0] : "error"), rows, whole: hidden <= 0 };
    }
    switch (name) {
      case "Run": case "Fetch": {
        const size = n ? plural(n, "line") : "no output";
        const receipt = name === "Fetch" ? "Fetched " + size : "Ran · " + size;
        if (n <= RUN_CAP) return { receipt, rows: out(lines), whole: true };
        // head + tail, so a closing summary like "42 passed" always survives
        const more = { cls: "more", text: "… +" + plural(n - RUN_HEAD - RUN_TAIL, "line") + " …" };
        return { receipt, rows: [...out(lines.slice(0, RUN_HEAD)), more, ...out(lines.slice(n - RUN_TAIL))], whole: false };
      }
      case "Search": case "Glob": {
        const receipt = "Found " + (name === "Search" ? plural(n, "match", "matches") : plural(n, "file"));
        const rows = out(lines.slice(0, LIST_PREVIEW_LINES));
        if (n > LIST_PREVIEW_LINES) rows.push({ cls: "more", text: "… +" + (n - LIST_PREVIEW_LINES) + " more" });
        return { receipt, rows, whole: n <= LIST_PREVIEW_LINES };
      }
      case "Edit": {
        const diff = diffPreview(lines);
        if (diff) {
          const adds = lines.filter((l) => l.startsWith("+") && !l.startsWith("+++")).length;
          const dels = lines.filter((l) => l.startsWith("-") && !l.startsWith("---")).length;
          return { receipt: "Updated +" + adds + " -" + dels, rows: diff, whole: n <= DIFF_PREVIEW_LINES };
        }
        return { receipt: "Edited · " + plural(n, "line"), rows: [], whole: n === 0 };
      }
      case "Write": return { receipt: "Written", rows: [], whole: n === 0 };
      case "Todo": return planView(lines);
      // Read / List: a verb and a count, no preview. Any other tool: its name and a count.
      case "Read": return { receipt: "Read " + plural(n, "line"), rows: [], whole: n === 0 };
      case "List": return { receipt: "Listed " + plural(n, "entry", "entries"), rows: [], whole: n === 0 };
      default: return { receipt: (name ? name + " · " : "") + plural(n, "line"), rows: [], whole: n === 0 };
    }
  }

  // The footer's outcome words and its marker's state (rule 13, ADR-0115, ADR-0122).
  function stopLabel(reason, degraded, openSteps, error) {
    const known = Object.prototype.hasOwnProperty.call(STOP_LABELS, reason);
    let label = known ? STOP_LABELS[reason] : String(reason).split("_").join(" ");
    let tone = "warn";
    if (reason === "completed") {
      if (degraded) label = "done — " + (openSteps ? "struggled" : "recovered");
      else tone = "ok";
    } else if (reason === "provider_error" || reason === "skill_too_large") {
      tone = "err";
      if (error) label += " — " + splitLines(error)[0];
    }
    if (openSteps) label += " — " + openSteps + " plan step(s) left open";
    return { label, tone };
  }

  function fmtDur(seconds) {
    if (seconds < 60) return seconds.toFixed(1) + "s";
    return Math.floor(seconds / 60) + "m " + Math.floor(seconds % 60) + "s";
  }
  // Python rounds an exact binary tie to even, where toFixed rounds it up. For n / 1000 the
  // only exact ties are x.25 and x.75, and only x.25 rounds differently: 1250 is "1.2k".
  function fmtTokens(n) {
    if (n < 1000) return n + " tokens";
    return ((n % 1000 === 250 ? n - 50 : n) / 1000).toFixed(1) + "k tokens";
  }
  // Four places, trailing zeros stripped to two: 0.0230 is $0.023, 0.0004 is $0.0004.
  function fmtCost(c) {
    const [whole, frac] = (c || 0).toFixed(4).split(".");
    return "$" + whole + "." + frac.replace(/0+$/, "").padEnd(2, "0");
  }
  // The prompt's cached share (ADR-0021), with Python's round(): an exact .5 goes to even.
  function cachePercent(cached, prompt) {
    const x = 100 * cached / prompt;
    const f = Math.floor(x);
    return x - f === 0.5 ? f + (f % 2) : Math.round(x);
  }
  // The footer before its wall-clock stamp: outcome, iterations, tokens (and the cached share
  // when the backend reports one), cost, elapsed — the last left out when it is not known.
  function footerText(label, iterations, usage, seconds) {
    let tokens = fmtTokens(usage.total_tokens || 0);
    if (usage.cache_read_tokens && usage.prompt_tokens) {
      tokens += " (" + cachePercent(usage.cache_read_tokens, usage.prompt_tokens) + "% cached)";
    }
    const parts = [label, iterations + " iterations", tokens, fmtCost(usage.cost_usd || 0)];
    if (seconds !== null) parts.push(fmtDur(seconds));
    return parts.join(" · ");
  }
  // END terminal-grammar

  // HH:MM on the viewer's clock, of `at` — the server's publish stamp (epoch seconds) — so a
  // replayed turn keeps its own time; a frame without one is stamped as it arrives.
  function hhmm(at) {
    const d = typeof at === "number" ? new Date(at * 1000) : new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  // Seconds between two publish stamps, or null when either frame lacks one.
  function between(from, to) {
    return typeof from === "number" && typeof to === "number" ? Math.max(0, to - from) : null;
  }
  function emptyUsage() { return { total_tokens: 0, cost_usd: 0, prompt_tokens: 0, cache_read_tokens: 0 }; }

  function titleCase(name) {
    return String(name).replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
  }

  function displayName(name) { return DISPLAY_NAMES[name] || titleCase(name); }

  function fmtBytes(n) {
    n = Number(n || 0);
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }

  function artifactUrl(artifact) {
    return "/sessions/" + encodeURIComponent(sessionId) +
      "/artifacts/" + encodeURIComponent(artifact.id) + "/download";
  }

  function uploadUrl() {
    return "/sessions/" + encodeURIComponent(sessionId) + "/uploads";
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(reader.error || new Error("could not read file"));
      reader.readAsDataURL(file);
    });
  }

  function addUploadPrompt(text) {
    if (!text) return;
    input.value = input.value.trim()
      ? input.value.trimEnd() + "\n\n" + text
      : text;
    autoGrow();
    input.focus();
  }

  async function uploadFiles(files) {
    if (!files || !files.length || turnActive || !sessionId) return;
    attachBtn.disabled = true;
    setStatus("uploading…");
    try {
      for (const file of files) {
        if (file.size > MAX_UPLOAD_BYTES) {
          add(errCard("upload too large: " + file.name + " (" + fmtBytes(file.size) + ")"));
          continue;
        }
        try {
          const data = await readAsDataUrl(file);
          const resp = await fetch(uploadUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: file.name, data }),
          });
          if (!resp.ok) {
            let detail = "HTTP " + resp.status;
            try {
              const body = await resp.json();
              if (body && body.detail) detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
            } catch {}
            add(errCard("upload failed: " + file.name + "\n" + detail));
            continue;
          }
          const uploaded = await resp.json();
          const body = el("div", "meta", "uploaded " + (uploaded.artifact?.filename || file.name) + " → " + uploaded.path);
          add(row("status", el("span", "", "·"), body));
          addUploadPrompt(uploaded.prompt);
        } catch (err) {
          const detail = err && err.message ? err.message : String(err);
          add(errCard("upload failed: " + file.name + "\n" + detail));
        }
      }
    } finally {
      hideStatus();
      attachBtn.disabled = turnActive;
      fileInput.value = "";
      follow();
    }
  }

  // ── assistant prose: re-render the current group on each delta ──
  // Inline markdown, the terminal's grammar exactly (docs/UX.md rule 19): ***x***, **x**,
  // __x__, ~~x~~, *x*, _x_, [label](url) and `code`, built with textContent only. A span
  // needs a word boundary on both sides, a letter or digit inside, never its own delimiter
  // inside, no file extension after the closer, and __ never wraps a bare identifier — so
  // __init__.py, 2*3*4, **/*.py and f(*args, **kwargs) render as written.
  const SPAN_TOKENS = [["***", "bi"], ["**", "b"], ["__", "b"], ["~~", "s"], ["*", "i"], ["_", "i"]];
  const LINK_RE = /^\[([^\]\n]+)\]\(([^)\s]+)\)/;
  const WORD_RE = /[\p{L}\p{N}_]/u, ALNUM_RE = /[\p{L}\p{N}]/u, IDENT_RE = /^[\p{L}\p{N}_]+$/u;
  function spanAt(text, i) {
    const ch = text[i];
    if (ch === "`") {
      const end = text.indexOf("`", i + 1);
      return end === -1 ? null : [el("code", "", text.slice(i + 1, end)), end + 1];
    }
    if (ch === "[") {
      const m = LINK_RE.exec(text.slice(i));
      if (!m) return null;
      const frag = document.createDocumentFragment();
      frag.appendChild(el("span", "link", m[1]));
      if (m[2] !== m[1]) frag.appendChild(el("span", "linkurl", " (" + m[2] + ")"));
      return [frag, i + m[0].length];
    }
    for (const [token, kind] of SPAN_TOKENS) {
      if (!text.startsWith(token, i)) continue;
      const start = i + token.length;
      const end = text.indexOf(token, start);
      const after = end + token.length;
      const content = text.slice(start, end);
      if (end <= start || /\s/.test(text[start]) || /\s/.test(text[end - 1])
          || !ALNUM_RE.test(content) || content.includes(token[0])
          || (i > 0 && (WORD_RE.test(text[i - 1]) || text[i - 1] === token[0]))
          || (after < text.length && (WORD_RE.test(text[after]) || text[after] === token[0]))
          || (after + 1 < text.length && text[after] === "." && ALNUM_RE.test(text[after + 1]))
          || (token === "__" && IDENT_RE.test(content))) continue;
      let node;
      if (kind === "bi") { node = el("strong", "", ""); node.appendChild(el("em", "", content)); }
      else node = el(kind === "b" ? "strong" : kind === "s" ? "s" : "em", "", content);
      return [node, after];
    }
    return null;
  }
  function inlineSpans(line, target) {
    let i = 0, run = "";
    const flush = () => { if (run) { target.appendChild(document.createTextNode(run)); run = ""; } };
    while (i < line.length) {
      const span = "`[*_~".includes(line[i]) ? spanAt(line, i) : null;
      if (span) { flush(); target.appendChild(span[0]); i = span[1]; continue; }
      run += line[i]; i += 1;
    }
    flush();
  }

  function codeBlock(lang, text) {
    const wrap = el("div", "codeblock");
    if (lang) wrap.appendChild(el("span", "lang", lang));
    const copy = el("button", "copy", "Copy");
    copy.type = "button";
    copy.onclick = () => {
      if (!navigator.clipboard) { copy.textContent = "Copy failed"; }
      else {
        navigator.clipboard.writeText(text).then(
          () => { copy.textContent = "Copied"; },
          () => { copy.textContent = "Copy failed"; },
        );
      }
      setTimeout(() => { copy.textContent = "Copy"; }, 2000);
    };
    wrap.appendChild(copy);
    wrap.appendChild(el("pre", "mono", text));
    return wrap;
  }

  function renderProse() {
    assistantBody.textContent = "";
    const lines = assistantText.split("\n");
    let i = 0, para = null, list = null;
    while (i < lines.length) {
      const raw = lines[i];
      const fence = raw.trimStart().match(/^```(\S*)/);
      if (fence) {
        para = null; list = null;
        const codeLines = [];
        i += 1;
        while (i < lines.length && !lines[i].trimStart().startsWith("```")) { codeLines.push(lines[i]); i += 1; }
        i += 1;  // closing fence (or stream end)
        assistantBody.appendChild(codeBlock(fence[1], codeLines.join("\n")));
        continue;
      }
      // A lone rule is a section break, never a drawn line (docs/UX.md rule 6).
      if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(raw)) { para = null; list = null; i += 1; continue; }
      const q = raw.match(/^\s*>\s(.*)$/);
      if (q) {
        para = null; list = null;
        const quote = el("div", "quote");
        inlineSpans(q[1], quote);
        assistantBody.appendChild(quote);
        i += 1; continue;
      }
      const h = raw.match(/^\s*(#{1,6})\s+(.*)$/);
      if (h) {
        para = null; list = null;
        const head = el("h" + Math.min(h[1].length, 3), "");
        inlineSpans(h[2], head);
        assistantBody.appendChild(head);
        i += 1; continue;
      }
      const b = raw.match(/^\s*[-*]\s+(.*)$/);
      if (b) {
        para = null;
        if (!list) { list = el("ul", ""); assistantBody.appendChild(list); }
        const li = el("li", "");
        inlineSpans(b[1], li);
        list.appendChild(li);
        i += 1; continue;
      }
      if (!raw.trim()) { para = null; list = null; i += 1; continue; }
      list = null;
      if (!para) { para = el("p", ""); assistantBody.appendChild(para); }
      else para.appendChild(document.createTextNode("\n"));
      inlineSpans(raw, para);
      i += 1;
    }
  }

  function onTextDelta(text) {
    if (!assistantBody) {
      assistantText = "";
      assistantBody = el("div", "prose");
      add(row("assistant", el("span", "adot"), assistantBody));
    }
    assistantText += text;
    renderProse();
    follow();
  }

  // ── reasoning ("thinking"): accumulates in its OWN collapsed region ──────────
  // Deliberately NOT routed through onTextDelta: reasoning is the model's scratchpad,
  // not its answer, and appending it to the prose group would corrupt the transcript
  // that gets copied, quoted and saved. Separate event type, separate DOM node.
  let thinkingBody = null;
  let thinkingText = "";
  function onThinkingDelta(text) {
    if (!thinkingBody) {
      thinkingText = "";
      const card = el("details", "thinking");
      card.appendChild(el("summary", "thinking-summary", "thinking…"));
      thinkingBody = el("div", "thinking-body");
      card.appendChild(thinkingBody);
      add(row("assistant", el("span", "adot"), card));
      // Re-anchor prose: text arriving after this must open a NEW group below the
      // reasoning card, never continue one that was open above it.
      assistantBody = null;
    }
    thinkingText += text;
    thinkingBody.textContent = thinkingText;
    follow();
  }

  // ── tool cards: created pending on tool_call, resolved by id on tool_result ──
  function onToolCall(ev) {
    assistantBody = null;
    const name = displayName(ev.name);
    const card = el("div", "tool");
    const details = el("details", "");
    const sum = el("summary", "tool-summary");
    const call = el("span", "call");
    const dot = el("span", "tdot pending");
    const receipt = el("span", "receipt", "…");
    call.appendChild(dot);
    call.appendChild(el("span", "tname", name));
    call.appendChild(el("span", "targs", "(" + condenseArgs(ev.arguments) + ")"));
    call.appendChild(el("span", "chev", "▸"));
    sum.appendChild(call);
    sum.appendChild(receipt);
    // Only a card with more output than it shows opens; a click on any other is a no-op.
    sum.addEventListener("click", (e) => { if (!card.classList.contains("expandable")) e.preventDefault(); });
    details.appendChild(sum);
    card.appendChild(details);
    add(card);
    toolCards.set(ev.id, { card, details, dot, receipt, name, at: ev.at });
    setStatus("using tools…");
  }

  // The rows under a receipt, as the terminal's rail draws them. A "more" row says what the
  // preview left out, and opens the card on the whole output.
  function previewBox(rows, details) {
    const box = el("div", "tool-out preview mono");
    for (const r of rows) {
      if (r.cls === "more") {
        const more = el("button", "more", r.text);
        more.type = "button";
        more.onclick = () => { details.open = true; };
        box.appendChild(more);
      } else if (r.cls === "todo-done" || r.cls === "todo-open") {
        const line = el("div", r.cls);
        line.appendChild(el("span", "", r.text.slice(0, 1)));   // the glyph, in its state colour
        line.appendChild(document.createTextNode(r.text.slice(1)));
        box.appendChild(line);
      } else {
        box.appendChild(el("div", r.cls === "out" || r.cls === "ctx" ? "" : r.cls, r.text));
      }
    }
    return box;
  }

  // The whole output, for an opened card: diff lines painted as bands, anything else as text.
  function fillOutput(body, output) {
    const lines = output.replace(/\n$/, "").split("\n");
    const isDiff = lines.some((l) => l.startsWith("@@")) ||
      (lines.some((l) => l.startsWith("--- ")) && lines.some((l) => l.startsWith("+++ ")));
    if (!isDiff) { body.textContent = output; return; }
    for (const line of lines) {
      let cls = "";
      if (line.startsWith("@@") || line.startsWith("--- ") || line.startsWith("+++ ")) cls = "dmeta";
      else if (line.startsWith("+")) cls = "add";
      else if (line.startsWith("-")) cls = "del";
      body.appendChild(el("div", cls, line));
    }
  }

  function artifactList(artifacts) {
    const wrap = el("div", "artifacts");
    for (const artifact of artifacts) {
      const link = el("a", "artifact-link");
      link.href = artifactUrl(artifact);
      link.download = artifact.filename || "";
      link.appendChild(el("span", "", artifact.filename || artifact.path || artifact.id));
      link.appendChild(el("span", "asize", fmtBytes(artifact.size)));
      wrap.appendChild(link);
    }
    return wrap;
  }

  function onToolResult(ev) {
    const entry = toolCards.get(ev.tool_use_id);
    const output = String(ev.output || "");
    const artifacts = Array.isArray(ev.artifacts) ? ev.artifacts : [];
    if (!entry) {
      // Reconnect/replay can deliver a result with no card: render it standalone, never throw.
      const body = el("div", "meta", "tool result · " + toolView("", output, ev.is_error).receipt);
      add(row("consent", el("span", "", "·"), body));
      if (artifacts.length) add(row("consent", el("span", "", "."), artifactList(artifacts)));
      return;
    }
    toolCards.delete(ev.tool_use_id);
    const view = toolView(entry.name, output, ev.is_error);
    if (entry.name === "Todo" && !ev.is_error) lastPlanKey = planKey(splitLines(output));
    entry.dot.classList.remove("pending");
    if (ev.is_error) { entry.card.classList.add("err"); entry.dot.classList.add("fail"); }
    // `· dur` between the call's and the result's publish stamps, as the terminal times a
    // call; left off when either stamp is missing, as the terminal leaves it off an unknown id.
    const took = between(entry.at, ev.at);
    entry.receipt.textContent = view.receipt + (took === null ? "" : " · " + fmtDur(took));
    if (!view.whole) {
      entry.card.classList.add("expandable");
      const full = el("div", "tool-out mono");
      fillOutput(full, output);
      entry.details.appendChild(full);
    }
    if (view.rows.length) entry.card.appendChild(previewBox(view.rows, entry.details));
    // Downloads stay in view: a file the agent made is never behind the toggle.
    if (artifacts.length) entry.card.appendChild(artifactList(artifacts));
    setStatus(toolCards.size ? "using tools…" : "thinking…");
    follow();
  }

  // On done / error-frame / interrupt / socket close: nothing may pulse forever.
  function abandonPending() {
    for (const entry of toolCards.values()) {
      entry.dot.classList.remove("pending");
      entry.receipt.textContent = "interrupted";
    }
    toolCards.clear();
  }

  // ── turn receipt: state-colored dot + the terminal's footer line ──
  function finishTurn(ev) {
    const usage = (ev.usage && ev.usage.total_tokens) ? ev.usage : turnUsage;
    const { label, tone } = stopLabel(ev.stop_reason || "", ev.degraded, ev.open_steps, ev.error);
    const text = footerText(label, ev.iterations || 0, usage, between(turnAt, ev.at));
    const body = el("div", "receipt", text + " · " + hhmm(ev.at));
    add(row("turnend", el("span", "rdot " + tone), body));
    endTurn();
  }

  function endTurn() {
    turnActive = false;
    hideStatus();
    setSendMode(false);
    approval.hidden = true;
    abandonPending();
    assistantBody = null;
    // Close the reasoning region too. The "text" case also clears it, but a turn
    // that ends without ever emitting text (tool-only, interrupted, error) would
    // otherwise leave it open and the NEXT turn's thinking would grow the previous
    // turn's card.
    thinkingBody = null;
    updateJump();
  }

  // Render one AgentEvent frame.
  function renderEvent(ev) {
    switch (ev.event) {
      case "text":
        // A real token ends the reasoning phase: close the region so a later
        // thinking phase (after a tool call) opens a fresh one instead of
        // re-growing the previous turn's card.
        thinkingBody = null;
        onTextDelta(ev.text);
        if (toolCards.size === 0) setStatus("writing…");
        return;
      case "thinking":
        onThinkingDelta(ev.text);
        if (toolCards.size === 0) setStatus("thinking…");
        return;
      case "tool_call":
        onToolCall(ev);
        return;
      case "tool_result":
        onToolResult(ev);
        return;
      case "status":
        assistantBody = null;
        add(row("status", el("span", "", "·"), el("div", "meta", ev.message)));
        // The server sends no done frame after a cancel; this status ends the turn.
        if (ev.message === "interrupted") finishTurn({ stop_reason: "interrupted", iterations: 0, usage: turnUsage, at: ev.at });
        return;
      case "task_update": {
        // A plan the HARNESS changed (ADR-0112), drawn as the terminal draws it: one line —
        // progress and the step in hand, or "Plan complete" (ADR-0108, ADR-0124) — and
        // silent when its checklist repeats the last plan drawn, here or by an update_plan
        // card. The checklist opens beneath the line, headed by the request it serves
        // (ADR-0113) so a reader sees what the steps are FOR. textContent only, row by row.
        const lines = splitLines(ev.plan || "");
        const key = planKey(lines);
        if (!key || key === lastPlanKey) return;
        lastPlanKey = key;
        assistantBody = null;
        const card = el("details", "");
        card.appendChild(el("summary", "", toolView("Todo", ev.plan || "", false).receipt));
        const box = el("div", "checklist");
        if (ev.request) box.appendChild(el("div", "", "Goal: " + ev.request));
        for (const line of lines) box.appendChild(el("div", "", line));
        card.appendChild(box);
        add(row("plan", el("span", "", "☰"), card));
        return;
      }
      case "user_message":
        // Every surface's says arrive here — the page's own sends included (the
        // bus is the one source of truth, so a remote `zakcode say` renders
        // identically to a typed message).
        assistantBody = null;
        thinkingBody = null;
        add(row("user", el("span", "", "›"), userBody(ev.text || "", ev.at)));
        turnActive = true;
        turnAt = ev.at;
        turnUsage = emptyUsage();
        setSendMode(true);
        setStatus("thinking…");
        stick = true;
        follow();
        return;
      case "session_rotated":
        add(row("status", el("span", "", "·"), el("div", "meta", "session restarted" + (ev.reason ? " — " + ev.reason : ""))));
        endTurn();
        return;
      case "usage":
        if (ev.usage) {
          for (const key of Object.keys(turnUsage)) turnUsage[key] += ev.usage[key] || 0;
        }
        return;
      case "done":
        finishTurn(ev);
        return;
      default:
        // Unknown event type → surface it rather than silently dropping (contract drift).
        add(errCard("[unknown event: " + JSON.stringify(ev) + "]"));
    }
  }

  // Server → client frames are either an AgentEvent ({event:...}) or a control frame
  // ({type:...}: action_required / error / status).
  function onFrame(frame) {
    if (frame && typeof frame.event === "string") {
      // Any event after action_required means the prompt resolved server-side
      // (e.g. the 120s fail-closed deny) — dismiss a stale card so a late click
      // can never write a false "allowed" consent receipt.
      if (!approval.hidden) { approval.hidden = true; setStatus("thinking…"); }
      renderEvent(frame);
      return;
    }
    switch (frame && frame.type) {
      case "action_required":
        showApproval(frame);
        setStatus("waiting on you");
        break;
      case "error":
        add(errCard("error: " + frame.detail));
        endTurn();
        break;
      case "status":
        assistantBody = null; // re-anchor: later prose must not render above this row
        add(row("status", el("span", "", "·"), el("div", "meta", frame.message)));
        break;
      default:
        add(errCard("[unknown frame: " + JSON.stringify(frame) + "]"));
    }
  }

  // ── approval card: warn-edged, scoped y/a/n keys, consent receipt on decision ──
  function showApproval(frame) {
    approvedTool = displayName(frame.tool_name);
    approvalTool.textContent = approvedTool;
    approvalDetail.textContent = "";
    const args = frame.arguments || {};
    if (typeof args.command === "string" && args.command) {
      approvalDetail.appendChild(el("div", "", "$ " + args.command));
    } else {
      for (const [key, value] of Object.entries(args)) {
        approvalDetail.appendChild(el("div", "", key + "  " + (typeof value === "string" ? value : JSON.stringify(value))));
      }
    }
    if (frame.reason) approvalDetail.appendChild(el("div", "ap-reason", frame.reason));
    approval.hidden = false;
    // Focus the primary action: announces the alertdialog to screen readers and
    // moves focus out of the composer so the advertised y/a/n keys actually work.
    document.getElementById("allow-once").focus();
  }

  const OUTCOME_KEYS = { allow_once: "y", allow_session: "a", deny_once: "n" };
  async function sendApproval(outcome) {
    try {
      const resp = await fetch("/say", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: OUTCOME_KEYS[outcome] }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      // The consent audit trail: a permanent receipt — written only when the
      // decision actually went to the server, so it can never claim a grant
      // the server didn't receive.
      const label = CONSENT_LABELS[outcome] || outcome.replace(/_/g, " ");
      add(row("consent", el("span", "", "·"), el("div", "meta", approvedTool + " — " + label)));
    } catch (e) {
      add(errCard("approval failed: " + e.message));
      return;
    }
    approval.hidden = true;
    setStatus("thinking…");
  }
  document.getElementById("allow-once").onclick = () => sendApproval("allow_once");
  document.getElementById("allow-session").onclick = () => sendApproval("allow_session");
  document.getElementById("deny").onclick = () => sendApproval("deny_once");

  // Scoped: never fires while typing in the composer or any editable element, and
  // never on modified chords — Ctrl/Cmd+A is select-all, not "allow for session".
  document.addEventListener("keydown", (e) => {
    if (approval.hidden) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const a = document.activeElement;
    if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.isContentEditable)) return;
    if (e.key === "y") { e.preventDefault(); sendApproval("allow_once"); }
    else if (e.key === "a") { e.preventDefault(); sendApproval("allow_session"); }
    else if (e.key === "n") { e.preventDefault(); sendApproval("deny_once"); }
  });

  // ── composer: Enter sends, Shift+Enter newline; Send morphs into Stop ──
  function setSendMode(streaming) {
    sendBtn.classList.toggle("stop", streaming);
    sendBtn.textContent = streaming ? "■" : "↑";
    sendBtn.setAttribute("aria-label", streaming ? "Stop" : "Send");
    attachBtn.disabled = streaming;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";  // CSS max-height caps at 6 rows
  }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    // The Enter that commits an IME composition must never send the half-finished
    // message (keyCode 229 covers Safari's isComposing=false commit quirk).
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    try {
      const resp = await fetch("/say", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (resp.status === 429) { setStatus("agent is busy — a message is already pending"); return; }
      if (!resp.ok) throw new Error("HTTP " + resp.status);
    } catch (e) {
      add(errCard("send failed: " + e.message));
      return;
    }
    // The transcript row arrives back on the watch stream as user_message — the
    // one source of truth, shared with every other surface.
    input.value = "";
    autoGrow();
    setStatus("queued…");
  }

  sendBtn.onclick = () => {
    if (turnActive) {
      fetch("/interrupt", { method: "POST" }).catch(() => add(errCard("interrupt failed")));
      return;
    }
    sendMessage();
  };
  attachBtn.onclick = () => {
    if (!turnActive) fileInput.click();
  };
  fileInput.onchange = () => uploadFiles(Array.from(fileInput.files || []));

  // Sample pills prefill the composer (they never send).
  for (const pill of document.querySelectorAll(".pill")) {
    pill.onclick = () => { input.value = pill.textContent; autoGrow(); input.focus(); };
  }

  // ── session bootstrap + socket ──
  function setConn(state, label) {
    connDot.className = "cdot " + state;
    connLabel.textContent = label;
  }

  async function init() {
    setConn("connecting", "connecting");
    try {
      // Join the workspace's CURRENT conversation; create it only if none exists —
      // one workspace, one conversation, shared with every surface.
      let resp = await fetch("/sessions/current");
      if (resp.status === 404) resp = await fetch("/sessions", { method: "POST" });
      if (!resp.ok) throw new Error("session " + resp.status);
      const info = await resp.json();
      sessionId = info.id;
      const id8 = sessionId.slice(0, 8);
      document.getElementById("chip-model").textContent = info.model;
      document.getElementById("chip-session").textContent = id8;
      document.getElementById("empty-meta").textContent = info.model + " · session " + id8;
      watchLoop();
    } catch (e) {
      setConn("closed", "disconnected");
      add(errCard("could not join a session: " + e.message));
    }
  }

  // SSE over fetch (EventSource cannot follow the id/cursor resume contract we
  // need); reconnects forever, resuming after the last seen cursor.
  async function watchLoop() {
    for (;;) {
      try {
        const qs = lastCursor !== null ? "&since=" + encodeURIComponent(lastCursor) : "";
        const resp = await fetch("/watch/" + sessionId + "?full=1" + qs);
        if (!resp.ok) throw new Error("watch " + resp.status);
        setConn("open", "connected");
        await readSse(resp.body, (id, data) => {
          if (id) lastCursor = id;
          try { onFrame(JSON.parse(data)); }
          catch { add(errCard("[bad frame]")); }
        });
      } catch (e) { /* fall through to reconnect */ }
      setConn("connecting", "reconnecting");
      endTurn();
      await new Promise((r) => setTimeout(r, 1500));
    }
  }

  async function readSse(body, onEvent) {
    const reader = body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) return;
      buf += dec.decode(value, { stream: true });
      // sse-starlette frames with \r\n line endings; normalize so the \n\n
      // frame-boundary scan below works. A trailing lone \r (a split \r\n
      // pair) stays in buf and is normalized once its \n arrives.
      buf = buf.replace(/\r\n/g, "\n");
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let id = null, data = "";
        for (const line of chunk.split("\n")) {
          if (line.startsWith("id:")) id = line.slice(3).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (data) onEvent(id, data);
      }
    }
  }

  init();
  </script>
</body>
</html>
