[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zakcode"
version = "0.0.1"
description = "Zak Code — a clean-room, vendor-agnostic, API-first agentic coding tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Zachary Kysar" }]
keywords = ["ai", "agent", "coding-agent", "cli", "llm", "litellm", "vendor-agnostic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Code Generators",
]

# Core engine dependencies (the importable library + CLI).
dependencies = [
  "zds-llm-provider[structured]", # vendor-agnostic provider ABC (M-7, in-repo editable) + jsonschema for structured output
  "litellm>=1.55",          # vendor-agnostic LLM layer (Ollama, OpenAI, + ~100 providers)
  "pydantic>=2.7",          # typed models for tools, messages, config
  "pydantic-settings>=2.3", # 12-factor config from env / .env
  "python-dotenv>=1.0",     # .env loading for pydantic-settings
  "typer>=0.12",            # CLI framework
  "rich>=13.7",             # terminal rendering
]

[project.optional-dependencies]
# API server layer (FastAPI exposing the core over HTTP / SSE / WebSocket).
server = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "websockets>=12.0",
]
# Model Context Protocol client (external tool/extension support).
mcp = ["mcp>=1.0"]
# Developer tooling. Kept as an extra for back-compat (`uv sync --extra dev`, and the
# `all` extra below); but the canonical install is plain `uv sync`, which installs the
# `dev` dependency-group (defined below) automatically.
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]
all = ["zakcode[server,mcp,dev]"]

# Dependency group (PEP 735). uv installs the `dev` group by DEFAULT on every
# `uv sync` and — unlike an extra — it is NOT dropped when you add `--extra server`.
# This is what makes `uv sync` and `uv sync --extra server` both keep the dev tools
# (the earlier footgun where `--extra server` silently uninstalled ruff/pytest/mypy).
[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
zakcode = "zakcode.cli:main"

[project.urls]
Homepage = "https://github.com/zkysar1/Zak-Code"
Repository = "https://github.com/zkysar1/Zak-Code"
Issues = "https://github.com/zkysar1/Zak-Code/issues"

[tool.uv.sources]
# In-repo editable path dependency: the extracted vendor-agnostic provider package
# (M-7). Editable so source edits under packages/zds-llm-provider are live without a
# re-sync. This is the portability contract in dependency form — zds_llm_provider
# depends only on pydantic, no vendor SDK.
zds-llm-provider = { path = "packages/zds-llm-provider", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zakcode"]
# Ship the PEP 561 marker so downstream type-checkers see zakcode as typed,
# and the bundled web-client static assets (served at "/" by the FastAPI app).
artifacts = ["src/zakcode/py.typed", "src/zakcode/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["zakcode"]
ignore_missing_imports = true
warn_unused_ignores = true
