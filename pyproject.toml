[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zakcode"
version = "0.0.1"
description = "Zak Code — a clean-room, vendor-agnostic, API-first agentic coding tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Zachary Kysar" }]
keywords = ["ai", "agent", "coding-agent", "cli", "llm", "litellm", "vendor-agnostic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Code Generators",
]

# Core engine dependencies (the importable library + CLI).
dependencies = [
  "jsonschema>=4.18",       # structured-output schema validation (providers/structured.py)
  "litellm>=1.55",          # vendor-agnostic LLM layer (Ollama, OpenAI, + ~100 providers)
  "pydantic>=2.7",          # typed models for tools, messages, config
  "pydantic-settings>=2.3", # 12-factor config from env / .env
  "python-dotenv>=1.0",     # .env loading for pydantic-settings
  "typer>=0.12",            # CLI framework
  "rich>=13.7",             # terminal rendering
]

[project.optional-dependencies]
# API server layer (FastAPI exposing the core over HTTP / SSE / WebSocket).
server = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "websockets>=12.0",
]
# Model Context Protocol client (external tool/extension support).
mcp = ["mcp>=1.0"]
# Web tools (web_search / web_fetch). `ddgs` powers the default DuckDuckGo backend; `httpx`
# covers the Tavily + SearXNG backends (plain REST) and the web_fetch HTTP client. Both are
# soft-imported, so the tools register without this extra and report a clean install hint.
web = ["ddgs>=9.0", "httpx>=0.27"]
# Developer tooling. Kept as an extra for back-compat (`uv sync --extra dev`, and the
# `all` extra below); but the canonical install is plain `uv sync`, which installs the
# `dev` dependency-group (defined below) automatically.
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  "poethepoet>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]
all = ["zakcode[server,mcp,web,dev]"]

# Dependency group (PEP 735). uv installs the `dev` group by DEFAULT on every
# `uv sync` and — unlike an extra — it is NOT dropped when you add `--extra server`.
# This is what makes `uv sync` and `uv sync --extra server` both keep the dev tools
# (the earlier footgun where `--extra server` silently uninstalled ruff/pytest/mypy).
[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  "poethepoet>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
zakcode = "zakcode.cli:main"

[project.urls]
Homepage = "https://github.com/zkysar1/Zak-Code"
Repository = "https://github.com/zkysar1/Zak-Code"
Issues = "https://github.com/zkysar1/Zak-Code/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zakcode"]
# Ship the PEP 561 marker so downstream type-checkers see zakcode as typed,
# the bundled web-client static assets (served at "/" by the FastAPI app), and the
# bundled SKILL.md playbooks (discovered from src/zakcode/skills/bundled at runtime).
artifacts = [
    "src/zakcode/py.typed",
    "src/zakcode/server/static/**",
    "src/zakcode/skills/bundled/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
# Bare `pytest` (no uv editable install) resolves the src/ layout via pythonpath, so a
# fresh clone with deps can run the suite without `pip install -e .` first.
pythonpath = ["src"]
# Per-test timeout (pytest-timeout). The full suite runs in ~84s locally, so any
# single test exceeding 120s is genuinely hung -- fail it fast with a traceback
# instead of letting it stall the whole CI job to GitHub's 45-minute ceiling
# (the 2026-06-08 incident: an ubuntu-only hang that passes on Windows wedged
# every run for 45m with no signal). The traceback names the hanging test.
# `thread` method: a watchdog dumps every thread's stack (faulthandler) on
# timeout and hard-exits -- robust even against C-level/socket blocks that the
# default `signal` method (SIGALRM, main-thread-only) cannot interrupt.
timeout = 120
timeout_method = "thread"

[tool.mypy]
python_version = "3.11"
packages = ["zakcode"]
ignore_missing_imports = true
warn_unused_ignores = true

# Task runner (audit P2-3; acceptance 12): `uv run poe check` = the whole gate in one
# command (the same four steps CLAUDE.md lists and CI runs). poethepoet was chosen over
# Make (hostile on Windows, the primary dev box) and just (extra non-Python install).
[tool.poe.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
types = "mypy"
test = "pytest -q"
check = ["lint", "format-check", "types", "test"]
# Coverage (audit P2-1; acceptance 13): terminal report locally; CI uploads XML.
cov = "pytest -q --cov=zakcode --cov-report=term-missing"

[tool.coverage.run]
source = ["src/zakcode"]

[tool.coverage.report]
skip_empty = true
