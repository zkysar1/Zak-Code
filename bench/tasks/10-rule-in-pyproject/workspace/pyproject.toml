[project]
name = "textutils"
version = "0.3.0"
requires-python = ">=3.11"

# House style, enforced by `make lint` in CI: 79 columns, every function
# annotated, every public symbol documented, imports sorted.
[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
